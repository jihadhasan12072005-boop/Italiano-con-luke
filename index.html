1>Italiano con Luke</h1><p>Opening your Italian academy…</p></div></main><nav class="tabs" id="nav"></nav><script>
(function(){'use strict';
var DATA={"A1":[{"title":"Greetings","topic":"Greetings and introductions","rule":"Ciao is informal and can mean hello or goodbye. Buongiorno is polite during the day; buonasera is used in the evening. Use arrivederci for a polite goodbye.","examples":[["Ciao! Come stai?","Hi! How are you?"],["Buongiorno, signora.","Good morning, madam."],["Buonasera, a tutti.","Good evening, everyone."],["Arrivederci, a domani!","Goodbye, see you tomorrow!"],["Sto bene, grazie.","I am well, thank you."]],"quiz":[{"q":"Translate into Italian: Hi! How are you?","a":"Ciao! Come stai?","choices":["Ciao! Come stai?","Buongiorno, signora.","Buonasera, a tutti.","Arrivederci, a domani!"],"why":"“Ciao! Come stai?” means “Hi! How are you?”. Ciao is informal and can mean hello or goodbye."},{"q":"Translate into Italian: Good morning, madam.","a":"Buongiorno, signora.","choices":["Buongiorno, signora.","Buonasera, a tutti.","Arrivederci, a domani!","Sto bene, grazie."],"why":"“Buongiorno, signora.” means “Good morning, madam.”. Ciao is informal and can mean hello or goodbye."},{"q":"Translate into Italian: Good evening, everyone.","a":"Buonasera, a tutti.","choices":["Buonasera, a tutti.","Arrivederci, a domani!","Sto bene, grazie.","Ciao! Come stai?"],"why":"“Buonasera, a tutti.” means “Good evening, everyone.”. Ciao is informal and can mean hello or goodbye."},{"q":"Translate into Italian: Goodbye, see you tomorrow!","a":"Arrivederci, a domani!","choices":["Arrivederci, a domani!","Sto bene, grazie.","Ciao! Come stai?","Buongiorno, signora."],"why":"“Arrivederci, a domani!” means “Goodbye, see you tomorrow!”. Ciao is informal and can mean hello or goodbye."},{"q":"Translate into Italian: I am well, thank you.","a":"Sto bene, grazie.","choices":["Sto bene, grazie.","Ciao! Come stai?","Buongiorno, signora.","Buonasera, a tutti."],"why":"“Sto bene, grazie.” means “I am well, thank you.”. Ciao is informal and can mean hello or goodbye."}]},{"title":"Introductions","topic":"Names and where you are from","rule":"Use Mi chiamo + name to introduce yourself. Come ti chiami? is informal; Come si chiama? is formal. Sono di + city means I am from that city.","examples":[["Mi chiamo Luke.","My name is Luke."],["Come ti chiami?","What is your name?"],["Piacere di conoscerti.","Nice to meet you."],["Sono di Londra.","I am from London."],["Lei come si chiama?","What is your name? (formal)"]],"quiz":[{"q":"Translate into Italian: My name is Luke.","a":"Mi chiamo Luke.","choices":["Mi chiamo Luke.","Come ti chiami?","Piacere di conoscerti.","Sono di Londra."],"why":"“Mi chiamo Luke.” means “My name is Luke.”. Use Mi chiamo + name to introduce yourself."},{"q":"Translate into Italian: What is your name?","a":"Come ti chiami?","choices":["Come ti chiami?","Piacere di conoscerti.","Sono di Londra.","Lei come si chiama?"],"why":"“Come ti chiami?” means “What is your name?”. Use Mi chiamo + name to introduce yourself."},{"q":"Translate into Italian: Nice to meet you.","a":"Piacere di conoscerti.","choices":["Piacere di conoscerti.","Sono di Londra.","Lei come si chiama?","Mi chiamo Luke."],"why":"“Piacere di conoscerti.” means “Nice to meet you.”. Use Mi chiamo + name to introduce yourself."},{"q":"Translate into Italian: I am from London.","a":"Sono di Londra.","choices":["Sono di Londra.","Lei come si chiama?","Mi chiamo Luke.","Come ti chiami?"],"why":"“Sono di Londra.” means “I am from London.”. Use Mi chiamo + name to introduce yourself."},{"q":"Translate into Italian: What is your name? (formal)","a":"Lei come si chiama?","choices":["Lei come si chiama?","Mi chiamo Luke.","Come ti chiami?","Piacere di conoscerti."],"why":"“Lei come si chiama?” means “What is your name? (formal)”. Use Mi chiamo + name to introduce yourself."}]},{"title":"Essere and avere","topic":"Essere and avere","rule":"Essere means to be: sono, sei, è, siamo, siete, sono. Avere means to have: ho, hai, ha, abbiamo, avete, hanno. Italian uses avere for age and hunger.","examples":[["Io sono italiano.","I am Italian."],["Tu sei pronto?","Are you ready?"],["Lei ha venti anni.","She is twenty years old."],["Abbiamo fame.","We are hungry."],["Siamo studenti.","We are students."]],"quiz":[{"q":"Translate into Italian: I am Italian.","a":"Io sono italiano.","choices":["Io sono italiano.","Tu sei pronto?","Lei ha venti anni.","Abbiamo fame."],"why":"“Io sono italiano.” means “I am Italian.”. Essere means to be: sono, sei, è, siamo, siete, sono."},{"q":"Translate into Italian: Are you ready?","a":"Tu sei pronto?","choices":["Tu sei pronto?","Lei ha venti anni.","Abbiamo fame.","Siamo studenti."],"why":"“Tu sei pronto?” means “Are you ready?”. Essere means to be: sono, sei, è, siamo, siete, sono."},{"q":"Translate into Italian: She is twenty years old.","a":"Lei ha venti anni.","choices":["Lei ha venti anni.","Abbiamo fame.","Siamo studenti.","Io sono italiano."],"why":"“Lei ha venti anni.” means “She is twenty years old.”. Essere means to be: sono, sei, è, siamo, siete, sono."},{"q":"Translate into Italian: We are hungry.","a":"Abbiamo fame.","choices":["Abbiamo fame.","Siamo studenti.","Io sono italiano.","Tu sei pronto?"],"why":"“Abbiamo fame.” means “We are hungry.”. Essere means to be: sono, sei, è, siamo, siete, sono."},{"q":"Translate into Italian: We are students.","a":"Siamo studenti.","choices":["Siamo studenti.","Io sono italiano.","Tu sei pronto?","Lei ha venti anni."],"why":"“Siamo studenti.” means “We are students.”. Essere means to be: sono, sei, è, siamo, siete, sono."}]},{"title":"Articles and gender","topic":"Il, lo, la, un, una","rule":"Italian nouns have grammatical gender. Common singular definite articles: il (masculine), lo (masculine before s+consonant or z), la (feminine), l’ (before a vowel). Indefinite: un, uno, una, un’.","examples":[["Il libro è nuovo.","The book is new."],["La casa è grande.","The house is big."],["Lo studente parla.","The student speaks."],["Un amico arriva.","A friend arrives."],["Un’amica arriva.","A female friend arrives."]],"quiz":[{"q":"Translate into Italian: The book is new.","a":"Il libro è nuovo.","choices":["Il libro è nuovo.","La casa è grande.","Lo studente parla.","Un amico arriva."],"why":"“Il libro è nuovo.” means “The book is new.”. Italian nouns have grammatical gender."},{"q":"Translate into Italian: The house is big.","a":"La casa è grande.","choices":["La casa è grande.","Lo studente parla.","Un amico arriva.","Un’amica arriva."],"why":"“La casa è grande.” means “The house is big.”. Italian nouns have grammatical gender."},{"q":"Translate into Italian: The student speaks.","a":"Lo studente parla.","choices":["Lo studente parla.","Un amico arriva.","Un’amica arriva.","Il libro è nuovo."],"why":"“Lo studente parla.” means “The student speaks.”. Italian nouns have grammatical gender."},{"q":"Translate into Italian: A friend arrives.","a":"Un amico arriva.","choices":["Un amico arriva.","Un’amica arriva.","Il libro è nuovo.","La casa è grande."],"why":"“Un amico arriva.” means “A friend arrives.”. Italian nouns have grammatical gender."},{"q":"Translate into Italian: A female friend arrives.","a":"Un’amica arriva.","choices":["Un’amica arriva.","Il libro è nuovo.","La casa è grande.","Lo studente parla."],"why":"“Un’amica arriva.” means “A female friend arrives.”. Italian nouns have grammatical gender."}]},{"title":"Plural nouns","topic":"Numbers and prices","rule":"Most masculine nouns ending -o change to -i; most feminine nouns ending -a change to -e. Nouns ending -e often change to -i. Articles must agree.","examples":[["Un libro, due libri.","One book, two books."],["Una ragazza, due ragazze.","One girl, two girls."],["Il cane, i cani.","The dog, the dogs."],["La lezione, le lezioni.","The lesson, the lessons."],["Le case sono belle.","The houses are beautiful."]],"quiz":[{"q":"Translate into Italian: One book, two books.","a":"Un libro, due libri.","choices":["Un libro, due libri.","Una ragazza, due ragazze.","Il cane, i cani.","La lezione, le lezioni."],"why":"“Un libro, due libri.” means “One book, two books.”. Most masculine nouns ending -o change to -i; most feminine nouns ending -a change to -e."},{"q":"Translate into Italian: One girl, two girls.","a":"Una ragazza, due ragazze.","choices":["Una ragazza, due ragazze.","Il cane, i cani.","La lezione, le lezioni.","Le case sono belle."],"why":"“Una ragazza, due ragazze.” means “One girl, two girls.”. Most masculine nouns ending -o change to -i; most feminine nouns ending -a change to -e."},{"q":"Translate into Italian: The dog, the dogs.","a":"Il cane, i cani.","choices":["Il cane, i cani.","La lezione, le lezioni.","Le case sono belle.","Un libro, due libri."],"why":"“Il cane, i cani.” means “The dog, the dogs.”. Most masculine nouns ending -o change to -i; most feminine nouns ending -a change to -e."},{"q":"Translate into Italian: The lesson, the lessons.","a":"La lezione, le lezioni.","choices":["La lezione, le lezioni.","Le case sono belle.","Un libro, due libri.","Una ragazza, due ragazze."],"why":"“La lezione, le lezioni.” means “The lesson, the lessons.”. Most masculine nouns ending -o change to -i; most feminine nouns ending -a change to -e."},{"q":"Translate into Italian: The houses are beautiful.","a":"Le case sono belle.","choices":["Le case sono belle.","Un libro, due libri.","Una ragazza, due ragazze.","Il cane, i cani."],"why":"“Le case sono belle.” means “The houses are beautiful.”. Most masculine nouns ending -o change to -i; most feminine nouns ending -a change to -e."}]},{"title":"Present tense -are","topic":"Ordering politely","rule":"For regular -are verbs such as parlare: parlo, parli, parla, parliamo, parlate, parlano. The subject pronoun is often omitted because the ending identifies the person.","examples":[["Parlo italiano.","I speak Italian."],["Tu lavori oggi?","Are you working today?"],["Lei studia medicina.","She studies medicine."],["Noi abitiamo a Roma.","We live in Rome."],["Loro parlano piano.","They speak quietly."]],"quiz":[{"q":"Translate into Italian: I speak Italian.","a":"Parlo italiano.","choices":["Parlo italiano.","Tu lavori oggi?","Lei studia medicina.","Noi abitiamo a Roma."],"why":"“Parlo italiano.” means “I speak Italian.”. For regular -are verbs such as parlare: parlo, parli, parla, parliamo, parlate, parlano."},{"q":"Translate into Italian: Are you working today?","a":"Tu lavori oggi?","choices":["Tu lavori oggi?","Lei studia medicina.","Noi abitiamo a Roma.","Loro parlano piano."],"why":"“Tu lavori oggi?” means “Are you working today?”. For regular -are verbs such as parlare: parlo, parli, parla, parliamo, parlate, parlano."},{"q":"Translate into Italian: She studies medicine.","a":"Lei studia medicina.","choices":["Lei studia medicina.","Noi abitiamo a Roma.","Loro parlano piano.","Parlo italiano."],"why":"“Lei studia medicina.” means “She studies medicine.”. For regular -are verbs such as parlare: parlo, parli, parla, parliamo, parlate, parlano."},{"q":"Translate into Italian: We live in Rome.","a":"Noi abitiamo a Roma.","choices":["Noi abitiamo a Roma.","Loro parlano piano.","Parlo italiano.","Tu lavori oggi?"],"why":"“Noi abitiamo a Roma.” means “We live in Rome.”. For regular -are verbs such as parlare: parlo, parli, parla, parliamo, parlate, parlano."},{"q":"Translate into Italian: They speak quietly.","a":"Loro parlano piano.","choices":["Loro parlano piano.","Parlo italiano.","Tu lavori oggi?","Lei studia medicina."],"why":"“Loro parlano piano.” means “They speak quietly.”. For regular -are verbs such as parlare: parlo, parli, parla, parliamo, parlate, parlano."}]},{"title":"Present tense -ere","topic":"Regular -are verbs","rule":"For regular -ere verbs such as prendere: prendo, prendi, prende, prendiamo, prendete, prendono. Not every -ere verb is regular; learn common exceptions separately.","examples":[["Prendo un caffè.","I have a coffee."],["Leggi un libro?","Are you reading a book?"],["Lei vende fiori.","She sells flowers."],["Prendiamo il treno.","We take the train."],["Scrivete spesso?","Do you write often?"]],"quiz":[{"q":"Translate into Italian: I have a coffee.","a":"Prendo un caffè.","choices":["Prendo un caffè.","Leggi un libro?","Lei vende fiori.","Prendiamo il treno."],"why":"“Prendo un caffè.” means “I have a coffee.”. For regular -ere verbs such as prendere: prendo, prendi, prende, prendiamo, prendete, prendono."},{"q":"Translate into Italian: Are you reading a book?","a":"Leggi un libro?","choices":["Leggi un libro?","Lei vende fiori.","Prendiamo il treno.","Scrivete spesso?"],"why":"“Leggi un libro?” means “Are you reading a book?”. For regular -ere verbs such as prendere: prendo, prendi, prende, prendiamo, prendete, prendono."},{"q":"Translate into Italian: She sells flowers.","a":"Lei vende fiori.","choices":["Lei vende fiori.","Prendiamo il treno.","Scrivete spesso?","Prendo un caffè."],"why":"“Lei vende fiori.” means “She sells flowers.”. For regular -ere verbs such as prendere: prendo, prendi, prende, prendiamo, prendete, prendono."},{"q":"Translate into Italian: We take the train.","a":"Prendiamo il treno.","choices":["Prendiamo il treno.","Scrivete spesso?","Prendo un caffè.","Leggi un libro?"],"why":"“Prendiamo il treno.” means “We take the train.”. For regular -ere verbs such as prendere: prendo, prendi, prende, prendiamo, prendete, prendono."},{"q":"Translate into Italian: Do you write often?","a":"Scrivete spesso?","choices":["Scrivete spesso?","Prendo un caffè.","Leggi un libro?","Lei vende fiori."],"why":"“Scrivete spesso?” means “Do you write often?”. For regular -ere verbs such as prendere: prendo, prendi, prende, prendiamo, prendete, prendono."}]},{"title":"Present tense -ire","topic":"People and relationships","rule":"Many -ire verbs use -o, -i, -e, -iamo, -ite, -ono, e.g. dormire. Some add -isc- in singular and third-person plural, e.g. capire: capisco, capisci, capisce, capiamo, capite, capiscono.","examples":[["Dormo otto ore.","I sleep eight hours."],["Partiamo domani.","We leave tomorrow."],["Capisco la domanda.","I understand the question."],["Finisci alle sei?","Do you finish at six?"],["Loro preferiscono il tè.","They prefer tea."]],"quiz":[{"q":"Translate into Italian: I sleep eight hours.","a":"Dormo otto ore.","choices":["Dormo otto ore.","Partiamo domani.","Capisco la domanda.","Finisci alle sei?"],"why":"“Dormo otto ore.” means “I sleep eight hours.”. Many -ire verbs use -o, -i, -e, -iamo, -ite, -ono, e."},{"q":"Translate into Italian: We leave tomorrow.","a":"Partiamo domani.","choices":["Partiamo domani.","Capisco la domanda.","Finisci alle sei?","Loro preferiscono il tè."],"why":"“Partiamo domani.” means “We leave tomorrow.”. Many -ire verbs use -o, -i, -e, -iamo, -ite, -ono, e."},{"q":"Translate into Italian: I understand the question.","a":"Capisco la domanda.","choices":["Capisco la domanda.","Finisci alle sei?","Loro preferiscono il tè.","Dormo otto ore."],"why":"“Capisco la domanda.” means “I understand the question.”. Many -ire verbs use -o, -i, -e, -iamo, -ite, -ono, e."},{"q":"Translate into Italian: Do you finish at six?","a":"Finisci alle sei?","choices":["Finisci alle sei?","Loro preferiscono il tè.","Dormo otto ore.","Partiamo domani."],"why":"“Finisci alle sei?” means “Do you finish at six?”. Many -ire verbs use -o, -i, -e, -iamo, -ite, -ono, e."},{"q":"Translate into Italian: They prefer tea.","a":"Loro preferiscono il tè.","choices":["Loro preferiscono il tè.","Dormo otto ore.","Partiamo domani.","Capisco la domanda."],"why":"“Loro preferiscono il tè.” means “They prefer tea.”. Many -ire verbs use -o, -i, -e, -iamo, -ite, -ono, e."}]},{"title":"Questions and negatives","topic":"Places and directions","rule":"Italian often forms yes/no questions with rising intonation, not a separate auxiliary. Put non immediately before the conjugated verb to make a negative. Question words include dove, quando, come, perché, quanto.","examples":[["Parli italiano?","Do you speak Italian?"],["Non capisco.","I do not understand."],["Dove abiti?","Where do you live?"],["Quando parti?","When do you leave?"],["Perché studi italiano?","Why do you study Italian?"]],"quiz":[{"q":"Translate into Italian: Do you speak Italian?","a":"Parli italiano?","choices":["Parli italiano?","Non capisco.","Dove abiti?","Quando parti?"],"why":"“Parli italiano?” means “Do you speak Italian?”. Italian often forms yes/no questions with rising intonation, not a separate auxiliary."},{"q":"Translate into Italian: I do not understand.","a":"Non capisco.","choices":["Non capisco.","Dove abiti?","Quando parti?","Perché studi italiano?"],"why":"“Non capisco.” means “I do not understand.”. Italian often forms yes/no questions with rising intonation, not a separate auxiliary."},{"q":"Translate into Italian: Where do you live?","a":"Dove abiti?","choices":["Dove abiti?","Quando parti?","Perché studi italiano?","Parli italiano?"],"why":"“Dove abiti?” means “Where do you live?”. Italian often forms yes/no questions with rising intonation, not a separate auxiliary."},{"q":"Translate into Italian: When do you leave?","a":"Quando parti?","choices":["Quando parti?","Perché studi italiano?","Parli italiano?","Non capisco."],"why":"“Quando parti?” means “When do you leave?”. Italian often forms yes/no questions with rising intonation, not a separate auxiliary."},{"q":"Translate into Italian: Why do you study Italian?","a":"Perché studi italiano?","choices":["Perché studi italiano?","Parli italiano?","Non capisco.","Dove abiti?"],"why":"“Perché studi italiano?” means “Why do you study Italian?”. Italian often forms yes/no questions with rising intonation, not a separate auxiliary."}]},{"title":"Adjectives and agreement","topic":"Eating in Italy","rule":"Adjectives usually agree with the noun in gender and number: bello/bella/belli/belle. Many follow the noun, though some common adjectives precede it. Adjectives ending -e typically form plural -i.","examples":[["Una macchina rossa.","A red car."],["Due macchine rosse.","Two red cars."],["Un ragazzo simpatico.","A nice boy."],["Le città sono grandi.","The cities are big."],["Una bella giornata.","A beautiful day."]],"quiz":[{"q":"Translate into Italian: A red car.","a":"Una macchina rossa.","choices":["Una macchina rossa.","Due macchine rosse.","Un ragazzo simpatico.","Le città sono grandi."],"why":"“Una macchina rossa.” means “A red car.”. Adjectives usually agree with the noun in gender and number: bello/bella/belli/belle."},{"q":"Translate into Italian: Two red cars.","a":"Due macchine rosse.","choices":["Due macchine rosse.","Un ragazzo simpatico.","Le città sono grandi.","Una bella giornata."],"why":"“Due macchine rosse.” means “Two red cars.”. Adjectives usually agree with the noun in gender and number: bello/bella/belli/belle."},{"q":"Translate into Italian: A nice boy.","a":"Un ragazzo simpatico.","choices":["Un ragazzo simpatico.","Le città sono grandi.","Una bella giornata.","Una macchina rossa."],"why":"“Un ragazzo simpatico.” means “A nice boy.”. Adjectives usually agree with the noun in gender and number: bello/bella/belli/belle."},{"q":"Translate into Italian: The cities are big.","a":"Le città sono grandi.","choices":["Le città sono grandi.","Una bella giornata.","Una macchina rossa.","Due macchine rosse."],"why":"“Le città sono grandi.” means “The cities are big.”. Adjectives usually agree with the noun in gender and number: bello/bella/belli/belle."},{"q":"Translate into Italian: A beautiful day.","a":"Una bella giornata.","choices":["Una bella giornata.","Una macchina rossa.","Due macchine rosse.","Un ragazzo simpatico."],"why":"“Una bella giornata.” means “A beautiful day.”. Adjectives usually agree with the noun in gender and number: bello/bella/belli/belle."}]},{"title":"Numbers and age","topic":"Common reflexive verbs","rule":"Italian numbers are used with avere to express age: ho ventuno anni. Use quanti anni hai? to ask someone’s age informally. For prices, use costa/costano.","examples":[["Ho ventuno anni.","I am twenty-one years old."],["Quanti anni hai?","How old are you?"],["Costa dodici euro.","It costs twelve euros."],["Siamo in tre.","There are three of us."],["Il treno parte alle nove.","The train leaves at nine."]],"quiz":[{"q":"Translate into Italian: I am twenty-one years old.","a":"Ho ventuno anni.","choices":["Ho ventuno anni.","Quanti anni hai?","Costa dodici euro.","Siamo in tre."],"why":"“Ho ventuno anni.” means “I am twenty-one years old.”. Italian numbers are used with avere to express age: ho ventuno anni."},{"q":"Translate into Italian: How old are you?","a":"Quanti anni hai?","choices":["Quanti anni hai?","Costa dodici euro.","Siamo in tre.","Il treno parte alle nove."],"why":"“Quanti anni hai?” means “How old are you?”. Italian numbers are used with avere to express age: ho ventuno anni."},{"q":"Translate into Italian: It costs twelve euros.","a":"Costa dodici euro.","choices":["Costa dodici euro.","Siamo in tre.","Il treno parte alle nove.","Ho ventuno anni."],"why":"“Costa dodici euro.” means “It costs twelve euros.”. Italian numbers are used with avere to express age: ho ventuno anni."},{"q":"Translate into Italian: There are three of us.","a":"Siamo in tre.","choices":["Siamo in tre.","Il treno parte alle nove.","Ho ventuno anni.","Quanti anni hai?"],"why":"“Siamo in tre.” means “There are three of us.”. Italian numbers are used with avere to express age: ho ventuno anni."},{"q":"Translate into Italian: The train leaves at nine.","a":"Il treno parte alle nove.","choices":["Il treno parte alle nove.","Ho ventuno anni.","Quanti anni hai?","Costa dodici euro."],"why":"“Il treno parte alle nove.” means “The train leaves at nine.”. Italian numbers are used with avere to express age: ho ventuno anni."}]},{"title":"At the café","topic":"Putting it together","rule":"Use vorrei + noun for a polite order; per favore means please. Un/una agree with the item. The barista may ask altro? meaning anything else?","examples":[["Vorrei un cappuccino, per favore.","I would like a cappuccino, please."],["Un cornetto e un caffè.","A croissant and a coffee."],["Quanto costa?","How much does it cost?"],["Il conto, per favore.","The bill, please."],["Basta così, grazie.","That is all, thank you."]],"quiz":[{"q":"Translate into Italian: I would like a cappuccino, please.","a":"Vorrei un cappuccino, per favore.","choices":["Vorrei un cappuccino, per favore.","Un cornetto e un caffè.","Quanto costa?","Il conto, per favore."],"why":"“Vorrei un cappuccino, per favore.” means “I would like a cappuccino, please.”. Use vorrei + noun for a polite order; per favore means please."},{"q":"Translate into Italian: A croissant and a coffee.","a":"Un cornetto e un caffè.","choices":["Un cornetto e un caffè.","Quanto costa?","Il conto, per favore.","Basta così, grazie."],"why":"“Un cornetto e un caffè.” means “A croissant and a coffee.”. Use vorrei + noun for a polite order; per favore means please."},{"q":"Translate into Italian: How much does it cost?","a":"Quanto costa?","choices":["Quanto costa?","Il conto, per favore.","Basta così, grazie.","Vorrei un cappuccino, per favore."],"why":"“Quanto costa?” means “How much does it cost?”. Use vorrei + noun for a polite order; per favore means please."},{"q":"Translate into Italian: The bill, please.","a":"Il conto, per favore.","choices":["Il conto, per favore.","Basta così, grazie.","Vorrei un cappuccino, per favore.","Un cornetto e un caffè."],"why":"“Il conto, per favore.” means “The bill, please.”. Use vorrei + noun for a polite order; per favore means please."},{"q":"Translate into Italian: That is all, thank you.","a":"Basta così, grazie.","choices":["Basta così, grazie.","Vorrei un cappuccino, per favore.","Un cornetto e un caffè.","Quanto costa?"],"why":"“Basta così, grazie.” means “That is all, thank you.”. Use vorrei + noun for a polite order; per favore means please."}]},{"title":"Family and possessives","topic":"il, lo, la, l’ and plural articles","rule":"Possessives agree with the possessed noun, not the owner: mio padre, mia sorella, i miei amici. With singular family members, the article is usually omitted: mia madre, tuo fratello.","examples":[["Mia sorella vive a Milano.","My sister lives in Milan."],["Mio padre lavora qui.","My father works here."],["I miei amici sono gentili.","My friends are kind."],["Hai fratelli?","Do you have siblings?"],["Sua madre è italiana.","His or her mother is Italian."]],"quiz":[{"q":"Translate into Italian: My sister lives in Milan.","a":"Mia sorella vive a Milano.","choices":["Mia sorella vive a Milano.","Mio padre lavora qui.","I miei amici sono gentili.","Hai fratelli?"],"why":"“Mia sorella vive a Milano.” means “My sister lives in Milan.”. Possessives agree with the possessed noun, not the owner: mio padre, mia sorella, i miei amici."},{"q":"Translate into Italian: My father works here.","a":"Mio padre lavora qui.","choices":["Mio padre lavora qui.","I miei amici sono gentili.","Hai fratelli?","Sua madre è italiana."],"why":"“Mio padre lavora qui.” means “My father works here.”. Possessives agree with the possessed noun, not the owner: mio padre, mia sorella, i miei amici."},{"q":"Translate into Italian: My friends are kind.","a":"I miei amici sono gentili.","choices":["I miei amici sono gentili.","Hai fratelli?","Sua madre è italiana.","Mia sorella vive a Milano."],"why":"“I miei amici sono gentili.” means “My friends are kind.”. Possessives agree with the possessed noun, not the owner: mio padre, mia sorella, i miei amici."},{"q":"Translate into Italian: Do you have siblings?","a":"Hai fratelli?","choices":["Hai fratelli?","Sua madre è italiana.","Mia sorella vive a Milano.","Mio padre lavora qui."],"why":"“Hai fratelli?” means “Do you have siblings?”. Possessives agree with the possessed noun, not the owner: mio padre, mia sorella, i miei amici."},{"q":"Translate into Italian: His or her mother is Italian.","a":"Sua madre è italiana.","choices":["Sua madre è italiana.","Mia sorella vive a Milano.","Mio padre lavora qui.","I miei amici sono gentili."],"why":"“Sua madre è italiana.” means “His or her mother is Italian.”. Possessives agree with the possessed noun, not the owner: mio padre, mia sorella, i miei amici."}]},{"title":"Days and routines","topic":"Regular -are verbs","rule":"Use the present tense for habits. Days of the week are usually lowercase. On Mondays can be expressed with il lunedì; lunedì alone can refer to a particular Monday.","examples":[["Mi sveglio alle sette.","I wake up at seven."],["Il lunedì lavoro.","I work on Mondays."],["Faccio colazione a casa.","I have breakfast at home."],["La sera leggo.","In the evening I read."],["Vado a letto presto.","I go to bed early."]],"quiz":[{"q":"Translate into Italian: I wake up at seven.","a":"Mi sveglio alle sette.","choices":["Mi sveglio alle sette.","Il lunedì lavoro.","Faccio colazione a casa.","La sera leggo."],"why":"“Mi sveglio alle sette.” means “I wake up at seven.”. Use the present tense for habits."},{"q":"Translate into Italian: I work on Mondays.","a":"Il lunedì lavoro.","choices":["Il lunedì lavoro.","Faccio colazione a casa.","La sera leggo.","Vado a letto presto."],"why":"“Il lunedì lavoro.” means “I work on Mondays.”. Use the present tense for habits."},{"q":"Translate into Italian: I have breakfast at home.","a":"Faccio colazione a casa.","choices":["Faccio colazione a casa.","La sera leggo.","Vado a letto presto.","Mi sveglio alle sette."],"why":"“Faccio colazione a casa.” means “I have breakfast at home.”. Use the present tense for habits."},{"q":"Translate into Italian: In the evening I read.","a":"La sera leggo.","choices":["La sera leggo.","Vado a letto presto.","Mi sveglio alle sette.","Il lunedì lavoro."],"why":"“La sera leggo.” means “In the evening I read.”. Use the present tense for habits."},{"q":"Translate into Italian: I go to bed early.","a":"Vado a letto presto.","choices":["Vado a letto presto.","Mi sveglio alle sette.","Il lunedì lavoro.","Faccio colazione a casa."],"why":"“Vado a letto presto.” means “I go to bed early.”. Use the present tense for habits."}]},{"title":"Prepositions of place","topic":"Regular -ere verbs","rule":"A often marks cities or destinations (a Roma); in often marks countries (in Italia) and certain places (in banca). Da marks origin or someone’s place; di can mark origin.","examples":[["Abito a Torino.","I live in Turin."],["Vivo in Italia.","I live in Italy."],["Vengo da Napoli.","I come from Naples."],["Sono in biblioteca.","I am in the library."],["Vado dal medico.","I am going to the doctor."]],"quiz":[{"q":"Translate into Italian: I live in Turin.","a":"Abito a Torino.","choices":["Abito a Torino.","Vivo in Italia.","Vengo da Napoli.","Sono in biblioteca."],"why":"“Abito a Torino.” means “I live in Turin.”. A often marks cities or destinations (a Roma); in often marks countries (in Italia) and certain places (in banca)."},{"q":"Translate into Italian: I live in Italy.","a":"Vivo in Italia.","choices":["Vivo in Italia.","Vengo da Napoli.","Sono in biblioteca.","Vado dal medico."],"why":"“Vivo in Italia.” means “I live in Italy.”. A often marks cities or destinations (a Roma); in often marks countries (in Italia) and certain places (in banca)."},{"q":"Translate into Italian: I come from Naples.","a":"Vengo da Napoli.","choices":["Vengo da Napoli.","Sono in biblioteca.","Vado dal medico.","Abito a Torino."],"why":"“Vengo da Napoli.” means “I come from Naples.”. A often marks cities or destinations (a Roma); in often marks countries (in Italia) and certain places (in banca)."},{"q":"Translate into Italian: I am in the library.","a":"Sono in biblioteca.","choices":["Sono in biblioteca.","Vado dal medico.","Abito a Torino.","Vivo in Italia."],"why":"“Sono in biblioteca.” means “I am in the library.”. A often marks cities or destinations (a Roma); in often marks countries (in Italia) and certain places (in banca)."},{"q":"Translate into Italian: I am going to the doctor.","a":"Vado dal medico.","choices":["Vado dal medico.","Abito a Torino.","Vivo in Italia.","Vengo da Napoli."],"why":"“Vado dal medico.” means “I am going to the doctor.”. A often marks cities or destinations (a Roma); in often marks countries (in Italia) and certain places (in banca)."}]},{"title":"C’è and ci sono","topic":"Regular -ire verbs","rule":"Use c’è for there is (singular) and ci sono for there are (plural). For questions, use c’è...? or ci sono...?; negatives use non c’è / non ci sono.","examples":[["C’è una farmacia qui?","Is there a pharmacy here?"],["Ci sono due musei.","There are two museums."],["Non c’è acqua.","There is no water."],["Ci sono molti studenti.","There are many students."],["C’è un problema.","There is a problem."]],"quiz":[{"q":"Translate into Italian: Is there a pharmacy here?","a":"C’è una farmacia qui?","choices":["C’è una farmacia qui?","Ci sono due musei.","Non c’è acqua.","Ci sono molti studenti."],"why":"“C’è una farmacia qui?” means “Is there a pharmacy here?”. Use c’è for there is (singular) and ci sono for there are (plural)."},{"q":"Translate into Italian: There are two museums.","a":"Ci sono due musei.","choices":["Ci sono due musei.","Non c’è acqua.","Ci sono molti studenti.","C’è un problema."],"why":"“Ci sono due musei.” means “There are two museums.”. Use c’è for there is (singular) and ci sono for there are (plural)."},{"q":"Translate into Italian: There is no water.","a":"Non c’è acqua.","choices":["Non c’è acqua.","Ci sono molti studenti.","C’è un problema.","C’è una farmacia qui?"],"why":"“Non c’è acqua.” means “There is no water.”. Use c’è for there is (singular) and ci sono for there are (plural)."},{"q":"Translate into Italian: There are many students.","a":"Ci sono molti studenti.","choices":["Ci sono molti studenti.","C’è un problema.","C’è una farmacia qui?","Ci sono due musei."],"why":"“Ci sono molti studenti.” means “There are many students.”. Use c’è for there is (singular) and ci sono for there are (plural)."},{"q":"Translate into Italian: There is a problem.","a":"C’è un problema.","choices":["C’è un problema.","C’è una farmacia qui?","Ci sono due musei.","Non c’è acqua."],"why":"“C’è un problema.” means “There is a problem.”. Use c’è for there is (singular) and ci sono for there are (plural)."}]},{"title":"Modal verbs","topic":"Non, dove, quando, perché","rule":"Potere (can), dovere (must), volere (want) are irregular and usually take an infinitive: posso parlare, devo studiare, voglio partire. Use vorrei for a polite request.","examples":[["Posso entrare?","May I come in?"],["Devo studiare oggi.","I must study today."],["Vuoi uscire stasera?","Do you want to go out tonight?"],["Non possiamo aspettare.","We cannot wait."],["Vorrei imparare italiano.","I would like to learn Italian."]],"quiz":[{"q":"Translate into Italian: May I come in?","a":"Posso entrare?","choices":["Posso entrare?","Devo studiare oggi.","Vuoi uscire stasera?","Non possiamo aspettare."],"why":"“Posso entrare?” means “May I come in?”. Potere (can), dovere (must), volere (want) are irregular and usually take an infinitive: posso parlare, devo studiare, voglio partire."},{"q":"Translate into Italian: I must study today.","a":"Devo studiare oggi.","choices":["Devo studiare oggi.","Vuoi uscire stasera?","Non possiamo aspettare.","Vorrei imparare italiano."],"why":"“Devo studiare oggi.” means “I must study today.”. Potere (can), dovere (must), volere (want) are irregular and usually take an infinitive: posso parlare, devo studiare, voglio partire."},{"q":"Translate into Italian: Do you want to go out tonight?","a":"Vuoi uscire stasera?","choices":["Vuoi uscire stasera?","Non possiamo aspettare.","Vorrei imparare italiano.","Posso entrare?"],"why":"“Vuoi uscire stasera?” means “Do you want to go out tonight?”. Potere (can), dovere (must), volere (want) are irregular and usually take an infinitive: posso parlare, devo studiare, voglio partire."},{"q":"Translate into Italian: We cannot wait.","a":"Non possiamo aspettare.","choices":["Non possiamo aspettare.","Vorrei imparare italiano.","Posso entrare?","Devo studiare oggi."],"why":"“Non possiamo aspettare.” means “We cannot wait.”. Potere (can), dovere (must), volere (want) are irregular and usually take an infinitive: posso parlare, devo studiare, voglio partire."},{"q":"Translate into Italian: I would like to learn Italian.","a":"Vorrei imparare italiano.","choices":["Vorrei imparare italiano.","Posso entrare?","Devo studiare oggi.","Vuoi uscire stasera?"],"why":"“Vorrei imparare italiano.” means “I would like to learn Italian.”. Potere (can), dovere (must), volere (want) are irregular and usually take an infinitive: posso parlare, devo studiare, voglio partire."}]},{"title":"Reflexive verbs","topic":"Masculine feminine singular plural","rule":"Reflexive verbs use mi, ti, si, ci, vi, si before the conjugated verb: mi alzo, ti lavi. The infinitive ends in -si, e.g. svegliarsi. The reflexive pronoun changes with the subject.","examples":[["Mi chiamo Luke.","My name is Luke."],["Mi alzo alle otto.","I get up at eight."],["Ti lavi le mani?","Do you wash your hands?"],["Ci prepariamo in fretta.","We get ready quickly."],["Si svegliano presto.","They wake up early."]],"quiz":[{"q":"Translate into Italian: My name is Luke.","a":"Mi chiamo Luke.","choices":["Mi chiamo Luke.","Mi alzo alle otto.","Ti lavi le mani?","Ci prepariamo in fretta."],"why":"“Mi chiamo Luke.” means “My name is Luke.”. Reflexive verbs use mi, ti, si, ci, vi, si before the conjugated verb: mi alzo, ti lavi."},{"q":"Translate into Italian: I get up at eight.","a":"Mi alzo alle otto.","choices":["Mi alzo alle otto.","Ti lavi le mani?","Ci prepariamo in fretta.","Si svegliano presto."],"why":"“Mi alzo alle otto.” means “I get up at eight.”. Reflexive verbs use mi, ti, si, ci, vi, si before the conjugated verb: mi alzo, ti lavi."},{"q":"Translate into Italian: Do you wash your hands?","a":"Ti lavi le mani?","choices":["Ti lavi le mani?","Ci prepariamo in fretta.","Si svegliano presto.","Mi chiamo Luke."],"why":"“Ti lavi le mani?” means “Do you wash your hands?”. Reflexive verbs use mi, ti, si, ci, vi, si before the conjugated verb: mi alzo, ti lavi."},{"q":"Translate into Italian: We get ready quickly.","a":"Ci prepariamo in fretta.","choices":["Ci prepariamo in fretta.","Si svegliano presto.","Mi chiamo Luke.","Mi alzo alle otto."],"why":"“Ci prepariamo in fretta.” means “We get ready quickly.”. Reflexive verbs use mi, ti, si, ci, vi, si before the conjugated verb: mi alzo, ti lavi."},{"q":"Translate into Italian: They wake up early.","a":"Si svegliano presto.","choices":["Si svegliano presto.","Mi chiamo Luke.","Mi alzo alle otto.","Ti lavi le mani?"],"why":"“Si svegliano presto.” means “They wake up early.”. Reflexive verbs use mi, ti, si, ci, vi, si before the conjugated verb: mi alzo, ti lavi."}]},{"title":"Shopping and clothes","topic":"A, in, di, da, con, per","rule":"Use quanto costa? for a singular price and quanto costano? for plural items. Mi piace / mi piacciono agree with what is liked, not the person who likes it.","examples":[["Quanto costa questa giacca?","How much does this jacket cost?"],["Vorrei provare questa camicia.","I would like to try on this shirt."],["Avete una taglia più grande?","Do you have a larger size?"],["Mi piacciono queste scarpe.","I like these shoes."],["Pago con la carta.","I pay by card."]],"quiz":[{"q":"Translate into Italian: How much does this jacket cost?","a":"Quanto costa questa giacca?","choices":["Quanto costa questa giacca?","Vorrei provare questa camicia.","Avete una taglia più grande?","Mi piacciono queste scarpe."],"why":"“Quanto costa questa giacca?” means “How much does this jacket cost?”. Use quanto costa? for a singular price and quanto costano? for plural items."},{"q":"Translate into Italian: I would like to try on this shirt.","a":"Vorrei provare questa camicia.","choices":["Vorrei provare questa camicia.","Avete una taglia più grande?","Mi piacciono queste scarpe.","Pago con la carta."],"why":"“Vorrei provare questa camicia.” means “I would like to try on this shirt.”. Use quanto costa? for a singular price and quanto costano? for plural items."},{"q":"Translate into Italian: Do you have a larger size?","a":"Avete una taglia più grande?","choices":["Avete una taglia più grande?","Mi piacciono queste scarpe.","Pago con la carta.","Quanto costa questa giacca?"],"why":"“Avete una taglia più grande?” means “Do you have a larger size?”. Use quanto costa? for a singular price and quanto costano? for plural items."},{"q":"Translate into Italian: I like these shoes.","a":"Mi piacciono queste scarpe.","choices":["Mi piacciono queste scarpe.","Pago con la carta.","Quanto costa questa giacca?","Vorrei provare questa camicia."],"why":"“Mi piacciono queste scarpe.” means “I like these shoes.”. Use quanto costa? for a singular price and quanto costano? for plural items."},{"q":"Translate into Italian: I pay by card.","a":"Pago con la carta.","choices":["Pago con la carta.","Quanto costa questa giacca?","Vorrei provare questa camicia.","Avete una taglia più grande?"],"why":"“Pago con la carta.” means “I pay by card.”. Use quanto costa? for a singular price and quanto costano? for plural items."}]},{"title":"Direct object pronouns","topic":"Reflexive verbs and frequency","rule":"Lo (him/it masculine), la (her/it feminine), li (them masculine), le (them feminine) replace a direct object and usually precede the conjugated verb.","examples":[["Lo conosco.","I know him."],["La vedo ogni giorno.","I see her every day."],["Li compro domani.","I will buy them tomorrow."],["Le ascolto spesso.","I listen to them often."],["Non lo capisco.","I do not understand it."]],"quiz":[{"q":"Translate into Italian: I know him.","a":"Lo conosco.","choices":["Lo conosco.","La vedo ogni giorno.","Li compro domani.","Le ascolto spesso."],"why":"“Lo conosco.” means “I know him.”. Lo (him/it masculine), la (her/it feminine), li (them masculine), le (them feminine) replace a direct object and usually precede the conjugated verb."},{"q":"Translate into Italian: I see her every day.","a":"La vedo ogni giorno.","choices":["La vedo ogni giorno.","Li compro domani.","Le ascolto spesso.","Non lo capisco."],"why":"“La vedo ogni giorno.” means “I see her every day.”. Lo (him/it masculine), la (her/it feminine), li (them masculine), le (them feminine) replace a direct object and usually precede the conjugated verb."},{"q":"Translate into Italian: I will buy them tomorrow.","a":"Li compro domani.","choices":["Li compro domani.","Le ascolto spesso.","Non lo capisco.","Lo conosco."],"why":"“Li compro domani.” means “I will buy them tomorrow.”. Lo (him/it masculine), la (her/it feminine), li (them masculine), le (them feminine) replace a direct object and usually precede the conjugated verb."},{"q":"Translate into Italian: I listen to them often.","a":"Le ascolto spesso.","choices":["Le ascolto spesso.","Non lo capisco.","Lo conosco.","La vedo ogni giorno."],"why":"“Le ascolto spesso.” means “I listen to them often.”. Lo (him/it masculine), la (her/it feminine), li (them masculine), le (them feminine) replace a direct object and usually precede the conjugated verb."},{"q":"Translate into Italian: I do not understand it.","a":"Non lo capisco.","choices":["Non lo capisco.","Lo conosco.","La vedo ogni giorno.","Li compro domani."],"why":"“Non lo capisco.” means “I do not understand it.”. Lo (him/it masculine), la (her/it feminine), li (them masculine), le (them feminine) replace a direct object and usually precede the conjugated verb."}]},{"title":"Passato prossimo introduction","topic":"Potere, volere, dovere","rule":"The passato prossimo describes completed past actions. It uses present avere or essere + past participle. Many transitive verbs take avere; movement/change-of-state verbs often take essere, with participle agreement.","examples":[["Ho mangiato una pizza.","I ate a pizza."],["Abbiamo visitato Roma.","We visited Rome."],["Sono arrivato ieri.","I arrived yesterday. (male speaker)"],["Lei è partita presto.","She left early."],["Hai studiato?","Did you study?"]],"quiz":[{"q":"Translate into Italian: I ate a pizza.","a":"Ho mangiato una pizza.","choices":["Ho mangiato una pizza.","Abbiamo visitato Roma.","Sono arrivato ieri.","Lei è partita presto."],"why":"“Ho mangiato una pizza.” means “I ate a pizza.”. The passato prossimo describes completed past actions."},{"q":"Translate into Italian: We visited Rome.","a":"Abbiamo visitato Roma.","choices":["Abbiamo visitato Roma.","Sono arrivato ieri.","Lei è partita presto.","Hai studiato?"],"why":"“Abbiamo visitato Roma.” means “We visited Rome.”. The passato prossimo describes completed past actions."},{"q":"Translate into Italian: I arrived yesterday. (male speaker)","a":"Sono arrivato ieri.","choices":["Sono arrivato ieri.","Lei è partita presto.","Hai studiato?","Ho mangiato una pizza."],"why":"“Sono arrivato ieri.” means “I arrived yesterday. (male speaker)”. The passato prossimo describes completed past actions."},{"q":"Translate into Italian: She left early.","a":"Lei è partita presto.","choices":["Lei è partita presto.","Hai studiato?","Ho mangiato una pizza.","Abbiamo visitato Roma."],"why":"“Lei è partita presto.” means “She left early.”. The passato prossimo describes completed past actions."},{"q":"Translate into Italian: Did you study?","a":"Hai studiato?","choices":["Hai studiato?","Ho mangiato una pizza.","Abbiamo visitato Roma.","Sono arrivato ieri."],"why":"“Hai studiato?” means “Did you study?”. The passato prossimo describes completed past actions."}]},{"title":"Directions and travel","topic":"Everyday communication","rule":"Use dov’è...? to ask where something is. Imperatives like gira and vai are informal singular; giri and vada are formal. A destra means right; a sinistra means left.","examples":[["Scusi, dov’è la stazione?","Excuse me, where is the station?"],["Gira a destra.","Turn right. (informal)"],["Vada sempre dritto.","Go straight ahead. (formal)"],["È vicino alla piazza.","It is near the square."],["Quanto tempo ci vuole?","How long does it take?"]],"quiz":[{"q":"Translate into Italian: Excuse me, where is the station?","a":"Scusi, dov’è la stazione?","choices":["Scusi, dov’è la stazione?","Gira a destra.","Vada sempre dritto.","È vicino alla piazza."],"why":"“Scusi, dov’è la stazione?” means “Excuse me, where is the station?”. Use dov’è."},{"q":"Translate into Italian: Turn right. (informal)","a":"Gira a destra.","choices":["Gira a destra.","Vada sempre dritto.","È vicino alla piazza.","Quanto tempo ci vuole?"],"why":"“Gira a destra.” means “Turn right. (informal)”. Use dov’è."},{"q":"Translate into Italian: Go straight ahead. (formal)","a":"Vada sempre dritto.","choices":["Vada sempre dritto.","È vicino alla piazza.","Quanto tempo ci vuole?","Scusi, dov’è la stazione?"],"why":"“Vada sempre dritto.” means “Go straight ahead. (formal)”. Use dov’è."},{"q":"Translate into Italian: It is near the square.","a":"È vicino alla piazza.","choices":["È vicino alla piazza.","Quanto tempo ci vuole?","Scusi, dov’è la stazione?","Gira a destra."],"why":"“È vicino alla piazza.” means “It is near the square.”. Use dov’è."},{"q":"Translate into Italian: How long does it take?","a":"Quanto tempo ci vuole?","choices":["Quanto tempo ci vuole?","Scusi, dov’è la stazione?","Gira a destra.","Vada sempre dritto."],"why":"“Quanto tempo ci vuole?” means “How long does it take?”. Use dov’è."}]}],"A2":[{"title":"Past Experiences","topic":"Passato prossimo","rule":"Mangiare takes avere in the passato prossimo. Study the pattern in the Italian sentence, compare it with the English meaning, and notice how the verb or noun changes with its context.","examples":[["Ho mangiato","I ate / I have eaten"],["Ieri ho visitato Roma.","Yesterday I visited Rome."]],"quiz":[{"q":"Choose the past of “mangiare” with io.","a":"Ho mangiato","choices":["Sono mangiare","Ho mangiato","Mangio ieri"],"why":"Mangiare takes avere in the passato prossimo."}]},{"title":"Travel Stories","topic":"Movement verbs in the past","rule":"Andare uses essere in compound tenses. Study the pattern in the Italian sentence, compare it with the English meaning, and notice how the verb or noun changes with its context.","examples":[["Sono arrivato","I arrived (masculine speaker)"],["Siamo andati a Firenze.","We went to Florence."]],"quiz":[{"q":"Choose the auxiliary for “andare”.","a":"Essere","choices":["Avere","Essere","Fare"],"why":"Andare uses essere in compound tenses."}]},{"title":"Describing the Past","topic":"Imperfetto","rule":"Imperfetto often describes repeated or ongoing past actions. Study the pattern in the Italian sentence, compare it with the English meaning, and notice how the verb or noun changes with its context.","examples":[["Da piccolo giocavo","When I was little, I used to play"],["Prima abitavo a New York.","I used to live in New York."]],"quiz":[{"q":"Which tense describes a past habit?","a":"Imperfetto","choices":["Futuro","Imperfetto","Imperativo"],"why":"Imperfetto often describes repeated or ongoing past actions."}]},{"title":"Plans & Predictions","topic":"Future simple","rule":"Partirò is the first-person future of partire. Study the pattern in the Italian sentence, compare it with the English meaning, and notice how the verb or noun changes with its context.","examples":[["Partirò domani","I will leave tomorrow"],["Visiteremo Venezia.","We will visit Venice."]],"quiz":[{"q":"Complete: Domani io ___.","a":"partirò","choices":["partivo","partirò","parto ieri"],"why":"Partirò is the first-person future of partire."}]},{"title":"At the Restaurant","topic":"Polite requests","rule":"Potrei is the conditional of potere. Study the pattern in the Italian sentence, compare it with the English meaning, and notice how the verb or noun changes with its context.","examples":[["Potrei avere il menù?","Could I have the menu?"],["Vorremmo un tavolo per due.","We would like a table for two."]],"quiz":[{"q":"What does “potrei” express?","a":"A polite request","choices":["A command","A polite request","A past habit"],"why":"Potrei is the conditional of potere."}]},{"title":"Shopping","topic":"Comparisons","rule":"Più costoso means more expensive. Study the pattern in the Italian sentence, compare it with the English meaning, and notice how the verb or noun changes with its context.","examples":[["Più grande di","Bigger than"],["Questo costa meno.","This costs less."]],"quiz":[{"q":"How do you say “more expensive”?","a":"Più costoso","choices":["Meno caro","Più costoso","Così grande"],"why":"Più costoso means more expensive."}]},{"title":"Pronouns","topic":"Direct objects","rule":"Lo replaces a masculine singular direct object. Study the pattern in the Italian sentence, compare it with the English meaning, and notice how the verb or noun changes with its context.","examples":[["Lo vedo","I see him / it"],["La conosco bene.","I know her well."]],"quiz":[{"q":"Replace “il libro” in “Leggo il libro”.","a":"Lo leggo","choices":["La leggo","Li leggo","Lo leggo"],"why":"Lo replaces a masculine singular direct object."}]},{"title":"Health","topic":"At the pharmacy","rule":"Mal di gola means a sore throat. Study the pattern in the Italian sentence, compare it with the English meaning, and notice how the verb or noun changes with its context.","examples":[["Mi fa male la testa","My head hurts"],["Ho bisogno di una farmacia.","I need a pharmacy."]],"quiz":[{"q":"What does “ho mal di gola” mean?","a":"I have a sore throat","choices":["I have a fever","I have a sore throat","I have a headache"],"why":"Mal di gola means a sore throat."}]},{"title":"Giving Instructions","topic":"Imperative","rule":"Parla is the tu imperative of parlare. Study the pattern in the Italian sentence, compare it with the English meaning, and notice how the verb or noun changes with its context.","examples":[["Ascolta!","Listen!"],["Prendi la seconda strada.","Take the second street."]],"quiz":[{"q":"Choose the informal singular command “Speak!”","a":"Parla!","choices":["Parliamo!","Parla!","Parlavo!"],"why":"Parla is the tu imperative of parlare."}]},{"title":"Daily Connections","topic":"Prepositions","rule":"A + il contracts to al. Study the pattern in the Italian sentence, compare it with the English meaning, and notice how the verb or noun changes with its context.","examples":[["Vado al cinema","I go to the cinema"],["Vengo dalla stazione.","I am coming from the station."]],"quiz":[{"q":"Complete: Vado ___ cinema.","a":"al","choices":["dal","nel","al"],"why":"A + il contracts to al."}]},{"title":"Making Plans","topic":"Invitations","rule":"Ci vediamo is a common way to arrange a meeting. Study the pattern in the Italian sentence, compare it with the English meaning, and notice how the verb or noun changes with its context.","examples":[["Ti va di uscire?","Do you feel like going out?"],["Ci vediamo alle otto.","See you at eight."]],"quiz":[{"q":"What does “ci vediamo” mean?","a":"See you","choices":["We eat","See you","We study"],"why":"Ci vediamo is a common way to arrange a meeting."}]},{"title":"A2 Review","topic":"Travel and everyday life","rule":"Mi piacerebbe expresses a hypothetical desire. Study the pattern in the Italian sentence, compare it with the English meaning, and notice how the verb or noun changes with its context.","examples":[["Mi piacerebbe","I would like"],["Mi piacerebbe imparare meglio.","I would like to learn better."]],"quiz":[{"q":"Which form expresses a wish politely?","a":"Mi piacerebbe","choices":["Mi piaceva ieri","Mi piacerebbe","Mi piaccio"],"why":"Mi piacerebbe expresses a hypothetical desire."}]},{"title":"Past with avere","topic":"Passato prossimo and participles","rule":"Passato prossimo uses a present-tense auxiliary plus past participle. Many transitive verbs use avere: ho mangiato, hai mangiato, ha mangiato.","examples":[["Ho mangiato una pizza.","I ate a pizza."],["Abbiamo visto un film.","We watched a movie."]],"quiz":[{"q":"Translate: I ate a pizza.","a":"Ho mangiato una pizza.","choices":["Ho mangiato una pizza.","Abbiamo visto un film.","Non lo so."],"why":"The model answer is “Ho mangiato una pizza.”. Notice the structure: Passato prossimo and participles."},{"q":"Translate: We watched a movie.","a":"Abbiamo visto un film.","choices":["Abbiamo visto un film.","Ho mangiato una pizza.","Non capisco."],"why":"The model answer is “Abbiamo visto un film.”."}]},{"title":"Past with essere","topic":"Movement and agreement","rule":"Many verbs of movement and change use essere in the passato prossimo. The participle agrees with the subject: sono arrivato / arrivata.","examples":[["Sono arrivato ieri.","I arrived yesterday."],["Maria è partita presto.","Maria left early."]],"quiz":[{"q":"Translate: I arrived yesterday.","a":"Sono arrivato ieri.","choices":["Sono arrivato ieri.","Maria è partita presto.","Non lo so."],"why":"The model answer is “Sono arrivato ieri.”. Notice the structure: Movement and agreement."},{"q":"Translate: Maria left early.","a":"Maria è partita presto.","choices":["Maria è partita presto.","Sono arrivato ieri.","Non capisco."],"why":"The model answer is “Maria è partita presto.”."}]},{"title":"Imperfect tense","topic":"Habits and background in the past","rule":"Imperfetto describes repeated past habits, ongoing past states, and background. Contrast it with passato prossimo for completed events.","examples":[["Da bambino giocavo fuori.","As a child I used to play outside."],["Pioveva quando sono uscito.","It was raining when I went out."]],"quiz":[{"q":"Translate: As a child I used to play outside.","a":"Da bambino giocavo fuori.","choices":["Da bambino giocavo fuori.","Pioveva quando sono uscito.","Non lo so."],"why":"The model answer is “Da bambino giocavo fuori.”. Notice the structure: Habits and background in the past."},{"q":"Translate: It was raining when I went out.","a":"Pioveva quando sono uscito.","choices":["Pioveva quando sono uscito.","Da bambino giocavo fuori.","Non capisco."],"why":"The model answer is “Piov  model answer is “Potresti aiutarmi?”."}]},{"title":"Relative clauses","topic":"Che and cui","rule":"Focus on the structure: Che and cui. Read the two examples aloud, identify the verb forms and connectors, and then produce your own sentence without looking at the translation.","examples":[["Il libro che leggo è bello.","The book I am reading is good."],["La persona con cui parlo è gentile.","The person I am talking with is kind."]],"quiz":[{"q":"Translate: The book I am reading is good.","a":"Il libro che leggo è bello.","choices":["Il libro che leggo è bello.","La persona con cui parlo è gentile.","Non lo so."],"why":"The model answer is “Il libro che leggo è bello.”. Notice the structure: Che and cui."},{"q":"Translate: The person I am talking with is kind.","a":"La persona con cui parlo è gentile.","choices":["La persona con cui parlo è gentile.","Il libro che leggo è bello.","Non capisco."],"why":"The model answer is “La persona con cui parlo è gentile.”."}]},{"title":"A2 final integration","topic":"Travel, work and narration","rule":"Focus on the structure: Travel, work and narration. Read the two examples aloud, identify the verb forms and connectors, and then produce your own sentence without looking at the translation.","examples":[["Ieri ho perso il treno.","Yesterday I missed the train."],["Potrebbe indicarmi la strada?","Could you show me the way?"]],"quiz":[{"q":"Translate: Yesterday I missed the train.","a":"Ieri ho perso il treno.","choices":["Ieri ho perso il treno.","Potrebbe indicarmi la strada?","Non lo so."],"why":"The model answer is “Ieri ho perso il treno.”. Notice the structure: Travel, work and narration."},{"q":"Translate: Could you show me the way?","a":"Potrebbe indicarmi la strada?","choices":["Potrebbe indicarmi la strada?","Ieri ho perso il treno.","Non capisco."],"why":"The model answer is “Potrebbe indicarmi la strada?”."}]}],"B1":[{"title":"Opinions","topic":"Expressing viewpoints","rule":"Secondo me introduces a personal opinion. Study the pattern in the Italian sentence, compare it with the English meaning, and notice how the verb or noun changes with its context.","examples":[["Secondo me","In my opinion"],["Secondo me è una buona idea.","In my opinion it is a good idea."]],"quiz":[{"q":"How do you say “In my opinion”?","a":"Secondo me","choices":["A causa di","Secondo me","Per esempio"],"why":"Secondo me introduces a personal opinion."}]},{"title":"Possibilities","topic":"Present conditional","rule":"Farei is the present conditional of fare. Study the pattern in the Italian sentence, compare it with the English meaning, and notice how the verb or noun changes with its context.","examples":[["Farei un viaggio","I would take a trip"],["Comprerei una casa al mare.","I would buy a house by the sea."]],"quiz":[{"q":"Choose “I would do”.","a":"Farei","choices":["Farò","Facevo","Farei"],"why":"Farei is the present conditional of fare."}]},{"title":"Uncertainty","topic":"Present subjunctive","rule":"Credo che often introduces the subjunctive. Study the pattern in the Italian sentence, compare it with the English meaning, and notice how the verb or noun changes with its context.","examples":[["Penso che sia","I think that it is"],["Credo che lui abbia ragione.","I believe he is right."]],"quiz":[{"q":"Complete: Credo che ___ importante.","a":"sia","choices":["è sempre","sia","sarà ieri"],"why":"Credo che often introduces the subjunctive."}]},{"title":"Explaining Reasons","topic":"Cause and effect","rule":"Dato che introduces a reason. Study the pattern in the Italian sentence, compare it with the English meaning, and notice how the verb or noun changes with its context.","examples":[["Dato che piove","Since it is raining"],["Resto a casa perché sono stanco.","I am staying home because I am tired."]],"quiz":[{"q":"What does “dato che” mean?","a":"Since / given that","choices":["Although","Since / given that","Unless"],"why":"Dato che introduces a reason."}]},{"title":"Narrating Events","topic":"Past var KEY='italiano_luke_v3',progress={completed:{},exams:{},notes:{},reviews:[]};try{var p=JSON.parse(localStorage.getItem(KEY)||'null');if(p){progress.completed=p.completed||{};progress.exams=p.exams||{};progress.notes=p.notes||{};progress.reviews=p.reviews||[];}}catch(e){}
var st={page:'home',level:'A1',index:0,question:0,selected:-1,checked:false,score:0,exam:0,mode:'lesson'};
function save(){try{localStorage.setItem(KEY,JSON.stringify(progress));}catch(e){}}
function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function button(label,act,extra){return '<button class="btn '+(extra||'')+'" data-act="'+act+'">'+label+'</button>'}
function heading(title){return '<div class="top"><button class="back" data-act="back">‹</button><h2 class="heading">'+e(title)+'</h2></div>'}
function levels(){return '<div class="levels">'+['A1','A2','B1','B2'].map(function(x){return '<button data-level="'+x+'" class="'+(x===st.level?'on':'')+'">'+x+'</button>'}).join('')+'</div>'}
function done(){return Object.keys(progress.completed).filter(function(x){return progress.completed[x]}).length}
function home(){return '<div class="hero"><span class="eyebrow">Italian Academy · VERIFIED BUILD 03 · A1 to B2</span><h1>Ciao, Luke.<br>Andiamo!</h1><p>A structured Italian journey with grammar, vocabulary, examples, and active practice.</p>'+button('Start learning →','learn')+'</div><div class="card"><span class="eyebrow">Your journey</span><h2>88 lessons across four levels</h2><p>'+done()+' lessons completed</p><div class="progress"><div style="width:'+(done()/88*100)+'%"></div></div></div><div class="card"><h2>Learn, then use it</h2><p>Every lesson has an English explanation, Italian examples, listening, recall, and a knowledge check. The course is original practice material, not an official CEFR certification.</p></div>'}
function learn(){return heading('Learn Italian')+'<p class="muted">Choose a level. Start from the beginning or jump to a grammar topic.</p>'+levels()+'<div class="card"><h2>'+st.level+' · 22 lessons</h2><p class="note">Grammar, examples, pronunciation and challenges</p></div>'+DATA[st.level].map(function(x,i){return '<button class="lessonrow" data-lesson="'+i+'"><span class="num">'+(progress.completed[st.level+'-'+i]?'✓':i+1)+'</span><span class="grow"><strong>'+e(x.title)+'</strong><small>'+e(x.topic)+'</small></span><span>›</span></button>'}).join('')}
function current(){return DATA[st.level][st.index]}
function lesson(){var x=current();return heading(st.level+' · Lesson '+(st.index+1))+'<span class="pill">'+e(x.topic)+'</span><h2 class="heading">'+e(x.title)+'</h2><div class="card"><span class="eyebrow">01 · Teacher explanation</span><h3>Understand the rule</h3><div class="rule">'+e(x.rule)+'</div><p class="note">Teacher’s method: identify the pattern, say the examples aloud, then reproduce a sentence without looking.</p></div><div class="card"><span class="eyebrow">02 · Listen and notice</span><h3>Italian in context</h3>'+x.examples.map(function(v,i){return '<div class="example"><button class="sound" data-audio="'+i+'">▶ Listen</button><div class="italian">'+e(v[0])+'</div><div class="muted">'+e(v[1])+'</div></div>'}).join('')+'</div><div class="card"><span class="eyebrow">03 · Active recall</span><h3>Can you say it?</h3>'+x.examples.map(function(v,i){return '<details><summary>'+e(v[1])+' — reveal Italian</summary><p class="italian">'+e(v[0])+'</p><button class="sound" data-audio="'+i+'">▶ Listen</button></details>'}).join('')+'</div><div class="card"><span class="eyebrow">04 · Check your understanding</span><h3>Practice challenge</h3><p>Answer questions and review the explanation for mistakes.</p>'+button('Start challenge →','startquiz','full')+'</div>'}
function quizSet(){var x=current(),qs=x.quiz.slice();if(st.level!=='A1')x.examples.forEach(function(v,i){qs.push({q:'Which Italian sentence means: '+v[1],a:v[0],choices:[v[0],x.examples[(i+1)%x.examples.length][0],'Non capisco.'],why:'Correct translation: '+v[0]})});return qs}
function examSet(){var pool=[];DATA[st.level].forEach(function(x){x.quiz.forEach(function(q){pool.push(q)})});var arr=[];for(var i=0;i<15;i++)arr.push(pool[(i*7+st.exam*11)%pool.length]);return arr}
function quiz(){var qs=st.mode==='exam'?examSet():quizSet();if(st.question>=qs.length){if(st.mode==='lesson'){progress.completed[st.level+'-'+st.index]=true}else{progress.exams[st.level+'-'+st.exam]=st.score}save();return heading('Challenge completed')+'<div class="card"><h2>'+st.score+' / '+qs.length+'</h2><p>'+(st.score===qs.length?'Excellent work!':'Review the explanations and try again to strengthen your recall.')+'</p>'+button('Back to lessons','learn','full')+button('Try again','restart','secondary full')+'</div>'}var q=qs[st.question];return heading(st.mode==='exam'?'Practice exam':'Lesson challenge')+'<div class="card"><span class="pill">Question '+(st.question+1)+' of '+qs.length+'</span><h2>'+e(q.q)+'</h2>'+q.choices.map(function(c,i){return '<button class="choice '+(st.selected===i?'sel':'')+'" data-choice="'+i+'">'+e(c)+'</button>'}).join('')+(st.checked?'<div class="feedback '+(q.choices[st.selected]===q.a?'':'bad')+'"><b>'+(q.choices[st.selected]===q.a?'Correct!':'Not quite.')+'</b><p>'+e(q.why)+'</p><p><b>Answer:</b> '+e(q.a)+'</p></div>':'')+button(st.checked?'Next →':'Check answer',st.checked?'next':'check','full')+'</div>'}
function exams(){return heading('Practice exams')+levels()+'<div class="card"><h2>Level '+st.level+' practice</h2><p>Short quizzes for revision. These are generated from the course question bank and are not official exams or independent exam papers.</p></div>'+Array.from({length:10},function(_,i){return '<button class="lessonrow" data-exam="'+i+'"><span class="num">'+(i+1)+'</span><span class="grow"><strong>Practice form '+(i+1)+'</strong><small>15 questions · '+(progress.exams[st.level+'-'+i]===undefined?'Not attempted':progress.exams[st.level+'-'+i]+'/15')+'</small></span>›</button>'}).join('')}
function explore(){return heading('Explore Italy')+'<div class="card"><img class="photo" src="https://images.unsplash.com/photo-1552832230-c0197dd311b5?w=900&q=85" alt="Rome"><h2>In a Roman café</h2><p><b>Barista:</b> Buongiorno! Cosa desidera?</p><p class="muted">Good morning! What would you like?</p><p><b>Luke:</b> Vorrei un cappuccino, per favore.</p><p class="muted">I would like a cappuccino, please.</p><button class="btn secondary" data-say="Buongiorno! Cosa desidera?">▶ Listen to the barista</button></div><div class="card"><img class="photo" src="https://images.unsplash.com/photo-1514890547357-a9ee288728e0?w=900&q=85" alt="Venice"><h2>Asking for directions</h2><p><b>Luke:</b> Scusi, dov’è la stazione?</p><p class="muted">Excuse me, where is the station?</p><button class="btn secondary" data-say="Scusi, dov’è la stazione?">▶ Listen</button></div>'}
function profile(){return heading('Luke’s progress')+'<div class="card"><h2>'+done()+' / 88 lessons</h2><p>Your learning progress is stored in this browser.</p>'+button('Download progress backup','backup','full')+'<p class="note">Keep this backup before changing devices or clearing Safari data.</p></div><div class="card"><h3>Speech</h3><p>Italian speech uses your device’s available Italian voices. The app cannot install a new voice on your phone or guarantee studio-quality audio.</p><button class="btn secondary" data-say="Ciao, Luke! Benvenuto in Italia.">▶ Test Italian voice</button></div>'}
function render(){try{var pages={home:home,learn:learn,lesson:lesson,quiz:quiz,exams:exams,explore:explore,profile:profile};document.getElementById('app').innerHTML=pages[st.page]();document.getElementById('nav').innerHTML=[['home','⌂','Home'],['learn','▤','Learn'],['explore','◇','Explore'],['exams','▣','Exams'],['profile','◯','Profile']].map(function(x){return '<button data-act="'+x[0]+'" class="'+(st.page===x[0]?'on':'')+'"><span>'+x[1]+'</span>'+x[2]+'</button>'}).join('')}catch(err){document.getElementById('app').innerHTML='<div class="card"><h2>Unable to open this page</h2><p>'+e(err.message)+'</p><button class="btn" data-act="home">Return home</button></div>'}}
function go(p){st.page=p;st.selected=-1;st.checked=false;render();scrollTo(0,0)}
var voice=null;function voices(){if(!('speechSynthesis' in window))return;var a=speechSynthesis.getVoices().filter(function(v){return /^it(-|$)/i.test(v.lang)});voice=a.find(function(v){return /premium|enhanced|quality|alice|luca|elsa/i.test(v.name)})||a[0]||null}if('speechSynthesis' in window){voices();speechSynthesis.onvoiceschanged=voices}
function speak(t){if(!('speechSynthesis' in window)){alert('Speech is unavailable in this browser.');return}voices();speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.92;u.pitch=1;if(voice)u.voice=voice;speechSynthesis.speak(u)}
document.addEventListener('click',function(ev){var b=ev.target.closest('[data-act],[data-level],[data-lesson],[data-choice],[data-exam],[data-audio],[data-say]');if(!b)return;if(b.hasAttribute('data-say')){speak(b.getAttribute('data-say'));return}if(b.hasAttribute('data-audio')){speak(current().examples[+b.getAttribute('data-audio')][0]);return}if(b.hasAttribute('data-level')){st.level=b.getAttribute('data-level');render();return}if(b.hasAttribute('data-lesson')){st.index=+b.getAttribute('data-lesson');go('lesson');return}if(b.hasAttribute('data-exam')){st.exam=+b.getAttribute('data-exam');st.mode='exam';st.question=0;st.score=0;go('quiz');return}if(b.hasAttribute('data-choice')){if(!st.checked){st.selected=+b.getAttribute('data-choice');render()}return}var a=b.getAttribute('data-act');if(a==='back'){go(st.page==='lesson'||st.page==='quiz'?'learn':'home')}else if(a==='startquiz'){st.mode='lesson';st.question=0;st.score=0;go('quiz')}else if(a==='check'){if(st.selected<0)return;var q=(st.mode==='exam'?examSet():quizSet())[st.question];if(q.choices[st.selected]===q.a)st.score++;st.checked=true;render()}else if(a==='next'){st.question++;st.checked=false;st.selected=-1;render()}else if(a==='restart'){st.question=0;st.score=0;go('quiz')}else if(a==='backup'){var blob=new Blob([JSON.stringify(progress,null,2)],{type:'application/json'});var url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='luke-italian-progress.json';link.click();setTimeout(function(){URL.revokeObjectURL(url)},3000)}else if(a)go(a)});
render();})();
</script></body></html>
