<script>
/* show a friendly message instead of a blank screen if a script fails to load */
window.addEventListener('error', function (e) {
  if (e && e.target && e.target.tagName === 'SCRIPT') {
    var a = document.getElementById('app');
    if (a) a.innerHTML = '<div style="padding:28px;max-width:520px;margin:auto;font-family:sans-serif"><h2>Couldn’t load part of the app</h2><p>Please check your connection and reload. Your saved progress is safe.</p><button onclick="location.reload()" style="padding:12px 18px;border-radius:12px;border:0;background:#14533f;color:#fff;font-weight:700">Reload</button></div>';
  }
}, true);
</script>
