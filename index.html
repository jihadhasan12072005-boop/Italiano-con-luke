function home(){var d=total();return '<div class="hero hero-photo"><div class="eyebrow">YOUR PASSPORT TO ITALY · A1—B2</div><h1>Ciao, Luke.<br>Andiamo!</h1><p>Learn real Italian, one beautiful moment at a time.</p>'+button('Continue learning →','learn')+'</div><div class="welcome-strip"><span>✦ PERSONALIZED FOR LUKE</span><strong>Every day, a little more Italian.</strong></div><div class="section"><h2>Your journey</h2><span class="pill">A1 → B2</span></div><div class="card"><b>'+d+' of 48 lessons completed</b><div class="progress"><div style="width:'+pct(d,48)+'%"></div></div></div><div class="section"><h2>Discover Italy</h2></div>'+img('rome','A morning in Rome','YOUR FIRST ADVENTURE')+button('Explore Italy →','explore','full')+'<div class="section"><h2>Practice Italian</h2></div><div class="level-grid"><button class="level" data-act="exams"><strong>120</strong><span>Practice forms</span></button><button class="level" data-act="learn"><strong>48</strong><span>Lessons from A1 to B2</span></button></div>'}
function levels(){return '<div class="tabs">'+LEVELS.map(function(l){return '<button class="'+(l===state.level?'on':'')+'" data-level="'+l+'">'+l+'</button>';}).join('')+'</div>';}
function learn(){var a=DATA[state.level],n=a.filter(function(x,i){return saved.completed[state.level+'-'+i];}).length;return header('Learn Italian')+'<p class="muted">Structured lessons with vocabulary, examples, audio and checks.</p>'+levels()+'<div class="card"><h2 style="font:normal 29px Georgia,serif">Level '+state.level+'</h2><div class="progress"><div style="width:'+pct(n,12)+'%"></div></div>'+a.map(function(x,i){return '<button class="lesson" style="width:100%;background:transparent;border:0;text-align:left" data-lesson="'+i+'"><span class="num">'+(saved.completed[state.level+'-'+i]?'✓':i+1)+'</span><span class="grow"><strong>'+esc(x[0])+'</strong><p>'+esc(x[1])+'</p></span><span>›</span></button>';}).join('')+'</div>';}
function options(list,answer){return '<div class="choices">'+list.map(function(x,i){var c='choice'+(state.choice===i?' selected':'');if(state.checked&&x===answer)c+=' correct';else if(state.checked&&state.choice===i)c+=' wrong';return '<button class="'+c+'" data-choice="'+i+'" '+(state.checked?'disabled':'')+'>'+esc(x)+'</button>';}).join('')+'</div>';}
function lesson(){var x=DATA[state.level][state.lesson];return header('Lesson '+(state.lesson+1)+' · '+state.level)+'<p class="muted">'+esc(x[1])+'</p><h2 style="font:normal 31px Georgia,serif">'+esc(x[0])+'</h2><div class="card"><div class="row between"><span class="eyebrow">SAY IT IN ITALIAN</span><button class="sound" data-speak="phrase">♫</button></div><p class="italian">'+esc(x[2])+'</p><p class="muted">'+esc(x[3])+'</p></div><div class="card"><div class="row between"><b>IN CONTEXT</b><button class="sound" data-speak="sentence">♫</button></div><p class="italian">'+esc(x[4])+'</p><p class="muted">'+esc(x[5])+'</p></div><div class="card"><h3>Check your understanding</h3><b>'+esc(x[6])+'</b>'+options(x[8],x[7])+(state.checked?'<div class="explain"><b>'+(x[8][state.choice]===x[7]?'Correct!':'Not quite.')+'</b><p>'+esc(x[9])+'</p></div>'+button('Complete lesson →','complete','full'):button('Check answer','check','full') )+'</div>';}
var stories=[{name:'Rome',photo:'rome',title:'A morning in Rome',lines:[['Buongiorno! Cosa desidera?','Good morning! What would you like?','Un cappuccino, per favore.',['Un cappuccino, per favore.','Non lo so.','Dove abita?']],['Sono tre euro.','That is three euros.','Grazie mille!',['Buonanotte!','Grazie mille!','Sono di New York.']]]},{name:'Venice',photo:'venice',title:'Lost in Venice',lines:[['Ha bisogno di aiuto?','Do you need help?','Dov’è la stazione?',['Dov’è la stazione?','Mi chiamo Luke.','Un caffè, grazie.']],['Vada sempre dritto.','Go straight ahead.','Grazie per l’aiuto!',['Ho fame.','Grazie per l’aiuto!','Sono stanco.']]]},{name:'Florence',photo:'florence',title:'An afternoon in Florence',lines:[['Ha un biglietto?','Do you have a ticket?','Vorrei un biglietto.',['Vorrei un biglietto.','Dov’è il mare?','Sono stanco.']]]},{name:'Amalfi Coast',photo:'coast',title:'A seaside dinner',lines:[['Avete prenotato?','Do you have a reservation?','Sì, a nome Luke.',['Sono le otto.','Sì, a nome Luke.','Non ho sete.']]]}];
function explore(){return header('Explore Italy')+'<p class="muted">Practice conversations in real-life Italian situations.</p><div class="photo-grid">'+stories.map(function(s,i){return '<div data-story="'+i+'">'+img(s.photo,s.name,'ADVENTURE '+(i+1))+'<p><b>'+esc(s.title)+' →</b></p></div>';}).join('')+'</div>';}
function story(){var s=stories[state.story],q=s.lines[state.step];return header(s.name)+img(s.photo,s.title,'ITALIAN ADVENTURE')+'<div class="card"><span class="pill">Scene '+(state.step+1)+' of '+s.lines.length+'</span><div class="row between"><b>Local says:</b><button class="sound" data-speak="story">♫</button></div><p class="italian">'+esc(q[0])+'</p><p class="muted">'+esc(q[1])+'</p><h3>What would you say?</h3>'+options(q[3],q[2])+(state.checked?'<div class="explain">'+(q[3][state.choice]===q[2]?'Perfect!':'A natural response: '+esc(q[2]))+'</div>'+button('Continue →','nextstory','full'):button('Respond','check','full'))+'</div>';}
function questions(){var a=DATA[state.level],qs=[];for(var i=0;i<12;i++){var idx=(i*5+state.form*7+Math.floor(state.form/3))%12,x=a[idx],shift=(state.form+i)%3,o=x[8].slice();o=o.slice(shift).concat(o.slice(0,shift));qs.push({prompt:x[6],answer:x[7],options:o,why:x[9]});}return qs;}
function exams(){return header('Exam Academy')+'<p class="muted">30 practice forms per level. Original practice quizzes, not official certification papers.</p>'+levels()+'<div class="card"><h2>Level '+state.level+' · 30 forms</h2><p class="notice">Each form reuses 12 curated lesson questions in a different order.</p>'+Array.from({length:30},function(_,i){return '<button class="lesson" style="width:100%;background:transparent;border:0;text-align:left" data-form="'+i+'"><span class="num">'+(i+1)+'</span><span class="grow"><strong>Practice form '+(i+1)+'</strong><p>'+(saved.exams[state.level+'-'+i]!=null?'Best score '+saved.exams[state.level+'-'+i]+'/12':'12 questions')+'</p></span><span>›</span></button>';}).join('')+'</div>';}
function test(){var qs=questions();if(state.q>=12){var score=0;for(var i=0;i<12;i++)if(state.answers[i]===qs[i].answer)score++;var k=state.level+'-'+state.form;if(saved.exams[k]==null||saved.exams[k]<score){saved.exams[k]=score;persist();}return header('Your Results')+'<div class="card"><div class="result">'+score+'/12</div><p style="text-align:center">'+(score>=10?'Eccellente!':score>=7?'Ben fatto!':'Keep practicing!')+'</p><h3>Review your answers</h3>'+qs.map(function(q,i){return '<div class="word"><b>'+esc(q.prompt)+'</b><span>Your answer: '+esc(state.answers[i])+'</span><span>Correct: '+esc(q.answer)+' · '+esc(q.why)+'</span></div>';}).join('')+button('Back to exams','exams','full')+'</div>';}
var q=qs[state.q];return header('Exam '+(state.form+1))+'<p class="muted">Question '+(state.q+1)+' of 12</p><div class="progress"><div style="width:'+pct(state.q,12)+'%"></div></div><div class="card"><h2 style="font:normal 25px Georgia,serif">'+esc(q.prompt)+'</h2>'+options(q.options,'__no_correct_reveal__')+button(state.q===11?'Finish exam →':'Next question →','nextquestion','full')+'</div>';}
function profile(){return header('Luke’s Profile')+'<div class="card"><h2>Luke · New York</h2><div class="row between"><div class="stat"><b>'+total()+'</b><small>Lessons</small></div><div class="stat"><b>'+Object.keys(saved.exams).length+'</b><small>Exams</small></div><div class="stat"><b>'+pct(total(),48)+'%</b><small>Complete</small></div></div></div><div class="card"><h3>Learning data</h3><p class="notice">Your progress stays in this browser. Export a backup to protect it.</p>'+button('Export backup ↓','backup','full')+'<button class="btn outline full" data-act="import" style="margin-top:9px">Import backup ↑</button><input id="importfile" type="file" accept="application/json" style="display:none"><h3>Personal notes</h3><textarea id="notes">'+esc(saved.notes.text||'')+'</textarea>'+button('Save notes','savenotes','full')+'</div>';}
function nav(){var items=[['home','⌂','Home'],['learn','▤','Learn'],['explore','◇','Explore'],['exams','▣','Exams'],['profile','◯','Profile']];el('nav').innerHTML=items.map(function(x){return '<button class="'+(state.page===x[0]?'active':'')+'" data-act="'+x[0]+'"><span style="font-size:22px">'+x[1]+'</span>'+x[2]+'</button>';}).join('');}
function render(){try{var pages={home:home,learn:learn,lesson:lesson,explore:explore,story:story,exams:exams,test:test,profile:profile};el('app').innerHTML=pages[state.page]();nav();}catch(e){el('app').innerHTML='<div class="card"><h2>App error</h2><p>'+esc(e.message||e)+'</p><button class="btn" data-act="home">Return home</button></div>';}}
function go(p){state.page=p;state.choice=-1;state.checked=false;render();window.scrollTo(0,0);}
function say(t){
 if(!window.speechSynthesis||!window.SpeechSynthesisUtterance)return;
 var synth=window.speechSynthesis;
 synth.cancel();
 var u=new SpeechSynthesisUtterance(String(t).trim());
 u.lang='it-IT';u.rate=0.94;u.pitch=1;
 var voices=synth.getVoices()||[];
 var italian=voices.filter(function(v){return /^it(?:-|$)/i.test(v.lang||'');});
 italian.sort(function(a,b){
  function rank(v){var n=(v.name||'').toLowerCase();return (v.lang.toLowerCase()==='it-it'?10:0)+(v.localService?5:0)+(/alice|elsa|federica|luca|cosimo/.test(n)?3:0);}
  return rank(b)-rank(a);
 });
 if(italian.length)u.voice=italian[0];
 synth.speak(u);
}
function backup(){var a=document.createElement('a'),blob=new Blob([JSON.stringify({version:3,saved:saved},null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='italiano-luke-backup.json';document.body.appendChild(a);a.click();document.body.removeChild(a);}
document.addEventListener('click',function(e){var t=e.target;while(t&&t!==document&&!t.getAttribute('data-act')&&!t.getAttribute('data-level')&&!t.getAttribute('data-lesson')&&!t.getAttribute('data-choice')&&!t.getAttribute('data-story')&&!t.getAttribute('data-form')&&!t.getAttribute('data-speak'))t=t.parentNode;if(!t||t===document)return;
if(t.hasAttribute('data-level')){state.level=t.getAttribute('data-level');render();return;}
if(t.hasAttribute('data-lesson')){state.lesson=Number(t.getAttribute('data-lesson'));go('lesson');return;}
if(t.hasAttribute('data-form')){state.form=Number(t.getAttribute('data-form'));state.q=0;state.answers=[];go('test');return;}
if(t.hasAttribute('data-story')){state.story=Number(t.getAttribute('data-story'));state.step=0;go('story');return;}
if(t.hasAttribute('data-choice')){if(!state.checked){state.choice=Number(t.getAttribute('data-choice'));render();}return;}
if(t.hasAttribute('data-speak')){var v=t.getAttribute('data-speak'),x=DATA[state.level][state.lesson];say(v==='phrase'?x[2]:v==='sentence'?x[4]:stories[state.story].lines[state.step][0]);return;}
var a=t.getAttribute('data-act');if(a==='back'){go(state.page==='lesson'?'learn':state.page==='story'?'explore':state.page==='test'?'exams':'home');return;}
if(a==='check'){if(state.choice<0)return;state.checked=true;render();return;}
if(a==='complete'){saved.completed[state.level+'-'+state.lesson]=true;persist();if(state.lesson<11){state.lesson++;go('lesson');}else go('learn');return;}
if(a==='nextstory'){if(state.step+1<stories[state.story].lines.length){state.step++;go('story');}else go('explore');return;}
if(a==='nextquestion'){if(state.choice<0)return;state.answers.push(questions()[state.q].options[state.choice]);state.q++;go('test');return;}
if(a==='savenotes'){saved.notes.text=el('notes').value;persist();alert('Notes saved.');return;}
if(a==='backup'){backup();return;}
if(a==='import'){el('importfile').click();return;}
if(a==='home'||a==='learn'||a==='explore'||a==='exams'||a==='profile'){go(a);return;}
});
document.addEventListener('change',function(e){if(e.target.id!=='importfile'||!e.target.files[0])return;var r=new FileReader();r.onload=function(){try{var obj=JSON.parse(r.result);if(!obj.saved||!obj.saved.completed||!obj.saved.exams)throw Error('Invalid backup');if(confirm('Replace current progress?')){saved=obj.saved;persist();go('profile');}}catch(err){alert('Invalid backup file');}};r.readAsText(e.target.files[0]);});
render();
})();
</script></body></html>
