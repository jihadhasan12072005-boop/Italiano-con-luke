enter;color:#155747;font-weight:800}.grow{flex:1}.lessonrow small{display:block;color:var(--muted)}.rule{background:#f1f7f1;border-left:4px solid #36765e;border-radius:12px;padding:16px;line-height:1.85}.example{border-bottom:1px solid var(--line);padding:15px 0}.example:last-child{border:0}.italian{font-size:21px;font-weight:700;line-height:1.5}.sound{background:#e4f0e8;border:0;color:#195a46;border-radius:11px;padding:9px 13px;float:right}.choice{display:block;width:100%;text-align:left;background:#fff;border:1px solid #d4e1d9;border-radius:13px;padding:13px;margin:9px 0;color:var(--ink)}.choice.sel{border-color:#126b4e;background:#e9f4ed}.feedback{padding:14px;background:#f1f6f0;border-radius:12px;margin:12px 0}.feedback.bad{background:#fff0e9}.progress{height:9px;background:#e2ebe4;border-radius:20px;overflow:hidden}.progress div{height:100%;background:#2b8062}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#fffffff2;border-top:1px solid var(--line);padding:10px 5px calc(10px + env(safe-area-inset-bottom));z-index:4;backdrop-filter:blur(12px)}.tabs button{flex:1;max-width:150px;border:0;background:none;color:#6b7d73;padding:5px 2px;font-size:12px}.tabs button.on{color:#0c654c;font-weight:800}.tabs span{display:block;font-size:21px}.note{font-size:13px;color:#63766b}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.photo{width:100%;height:170px;object-fit:cover;border-radius:16px}.pill{display:inline-block;background:#e5f0e7;color:#1a624c;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:700}.input{width:100%;border:1px solid #cdded1;border-radius:12px;padding:13px;font-size:16px}.mini{padding:12px;background:#f4f7f3;border-radius:12px;margin:12px 0}details{background:#f5f8f4;padding:13px;border-radius:12px;margin:9px 0}summary{cursor:pointer;font-weight:700}@media(max-width:390px){.hero h1{font-size:40px}.card{padding:16px}}</style></head><body><main id="app"><div class="hero"><h1>Italiano con Luke</h1><p>Opening your Italian academy…</p></div></main><nav class="tabs" id="nav"></nav><script>
(function(){'use strict';
var DATA={"A1":[{"title":"First Words","topic":"Greetings and introductions","rule":"Italian greetings depend on context. Ciao is informal and can mean hello or goodbye; buongiorno is a polite daytime greeting; buonasera is used later in the day. Use Lei with strangers in formal situations.","examples":[["Ciao","Hi / Bye"],["Ciao, Luke!","Hi, Luke!"],["Buongiorno, signora.","Good morning, ma’am."],["Buonasera, come sta?","Good evening, how are you? (formal)"],["Piacere di conoscerti.","Nice to meet you. (informal)"],["Arrivederci, a domani!","Goodbye, see you tomorrow!"]],"quiz":[{"q":"How do you say “Good morning”?","a":"Buongiorno","choices":["Buonasera","Buongiorno","Arrivederci"],"why":"Buongiorno is a greeting used in the morning and daytime."}]},{"title":"Meet Someone","topic":"Names and where you are from","rule":"Mi chiamo + name introduces yourself. Come ti chiami? is informal; Come si chiama? is formal. Sono di + city or country indicates origin. Abito a + city means I live in.","examples":[["Mi chiamo Luke","My name is Luke"],["Sono di New York.","I am from New York."],["Come ti chiami?","What is your name? (informal)"],["Mi chiamo Luca.","My name is Luca."],["Di dove sei?","Where are you from?"],["Sono di Madrid, ma abito a Roma.","I am from Madrid, but I live in Rome."]],"quiz":[{"q":"How do you say “My name is Luke”?","a":"Mi chiamo Luke","choices":["Ho Luke","Mi chiamo Luke","Sono Luke anni"],"why":"Mi chiamo means “my name is”."}]},{"title":"Be & Have","topic":"Essere and avere","rule":"Essere (to be): sono, sei, è, siamo, siete, sono. Avere (to have): ho, hai, ha, abbiamo, avete, hanno. Italian uses avere for age: ho vent’anni, literally “I have twenty years.”","examples":[["Sono americano","I am American"],["Ho venti anni.","I am twenty years old."],["Io sono studente.","I am a student."],["Tu sei italiano?","Are you Italian?"],["Lei ha una sorella.","She has a sister."],["Abbiamo due libri.","We have two books."]],"quiz":[{"q":"Choose “I have”","a":"Ho","choices":["Sono","Hai","Ho"],"why":"Ho is the first-person form of avere (to have)."}]},{"title":"Articles","topic":"Il, lo, la, un, una","rule":"Definite articles agree with gender and number: il libro / i libri, la casa / le case, lo studente / gli studenti. Use l’ before vowels: l’amico, l’amica. Indefinite articles: un libro, uno studente, una casa, un’amica.","examples":[["Il libro","The book"],["La casa è bella.","The house is beautiful."],["Il ragazzo legge.","The boy reads."],["Lo studente parla.","The student speaks."],["L’amica arriva.","The female friend arrives."],["Una ragazza e un ragazzo.","A girl and a boy."]],"quiz":[{"q":"Which article goes with “casa”?","a":"La","choices":["Il","La","Lo"],"why":"Casa is a feminine singular noun."}]},{"title":"Everyday Numbers","topic":"Numbers and prices","rule":"Numbers 1–10: uno, due, tre, quattro, cinque, sei, sette, otto, nove, dieci. For prices ask Quanto costa? (singular) or Quanto costano? (plural). Euro remains euro in the plural.","examples":[["Quanto costa?","How much does it cost?"],["Costa cinque euro.","It costs five euros."],["Due cappuccini, per favore.","Two cappuccinos, please."],["Costa otto euro.","It costs eight euros."],["Quanto costano queste mele?","How much do these apples cost?"],["Ho tre fratelli.","I have three brothers."]],"quiz":[{"q":"How do you say “five”?","a":"Cinque","choices":["Quattro","Cinque","Sei"],"why":"Cinque means five."}]},{"title":"At the Café","topic":"Ordering politely","rule":"Vorrei + noun is a polite request (“I would like”). Un caffè in Italy usually means an espresso. Use per favore (please) and grazie (thank you). To ask for the bill: Il conto, per favore.","examples":[["Un caffè, per favore","A coffee, please"],["Vorrei un cappuccino.","I would like a cappuccino."],["Vorrei un tè, per favore.","I would like a tea, please."],["Prendo un espresso.","I’ll have an espresso."],["Il conto, per favore.","The bill, please."],["Posso pagare con carta?","Can I pay by card?"]],"quiz":[{"q":"What does “vorrei” mean?","a":"I would like","choices":["I have","I would like","I am"],"why":"Vorrei is a polite way to ask for something."}]},{"title":"Present Tense","topic":"Regular -are verbs","rule":"For regular -are verbs, remove -are and add -o, -i, -a, -iamo, -ate, -ano. Parlare: parlo, parli, parla, parliamo, parlate, parlano. The subject pronoun is often omitted because the ending identifies the subject.","examples":[["Parlo italiano","I speak Italian"],["Studio ogni giorno.","I study every day."],["Parlo italiano ogni giorno.","I speak Italian every day."],["Tu lavori a Roma.","You work in Rome."],["Studiamo insieme.","We study together."],["Loro abitano qui.","They live here."]],"quiz":[{"q":"Complete: Io ___ italiano.","a":"parlo","choices":["parli","parla","parlo"],"why":"The io form of parlare is parlo."}]},{"title":"Family","topic":"People and relationships","rule":"Family nouns include madre, padre, fratello, sorella, figlio, figlia. With a singular unmodified family member, Italian often omits the definite article after a possessive: mia madre, tuo fratello; but la mia sorellina takes the article.","examples":[["Mia sorella","My sister"],["Mio padre lavora.","My father works."],["Mia madre vive a Milano.","My mother lives in Milan."],["Ho una sorella e due fratelli.","I have a sister and two brothers."],["Questo è mio padre.","This is my father."],["La mia famiglia è grande.","My family is big."]],"quiz":[{"q":"What does “fratello” mean?","a":"Brother","choices":["Sister","Brother","Mother"],"why":"Fratello means brother."}]},{"title":"Around Town","topic":"Places and directions","rule":"Use c’è (there is) and ci sono (there are). For locations use vicino a (near), lontano da (far from), davanti a (in front of), dietro (behind). Dov’è...? asks where something is.","examples":[["Dov’è la stazione?","Where is the station?"],["La banca è a destra.","The bank is on the right."],["Dov’è la farmacia?","Where is the pharmacy?"],["C’è una banca qui vicino?","Is there a bank nearby?"],["La stazione è davanti al museo.","The station is in front of the museum."],["Ci sono due supermercati.","There are two supermarkets."]],"quiz":[{"q":"What does “a sinistra” mean?","a":"To the left","choices":["To the right","Straight ahead","To the left"],"why":"A sinistra means to the left."}]},{"title":"Food & Drinks","topic":"Eating in Italy","rule":"Food nouns have gender: il pane, la pasta, l’acqua. Mi piace + singular noun or infinitive; mi piacciono + plural noun. Preferisco means “I prefer”.","examples":[["L’acqua","Water"],["Mangio la pasta.","I eat pasta."],["Mi piace la pizza.","I like pizza."],["Mi piacciono le fragole.","I like strawberries."],["Preferisco l’acqua naturale.","I prefer still water."],["Non mangio carne.","I do not eat meat."]],"quiz":[{"q":"How do you say “water”?","a":"Acqua","choices":["Pane","Acqua","Latte"],"why":"Acqua is water."}]},{"title":"Daily Routine","topic":"Common reflexive verbs","rule":"Reflexive verbs use mi, ti, si, ci, vi, si. Svegliarsi: mi sveglio, ti svegli, si sveglia. The reflexive pronoun changes with the subject. Use alle + time: alle sette.","examples":[["Mi sveglio presto","I wake up early"],["Mi alzo alle sette.","I get up at seven."],["Mi sveglio alle sette.","I wake up at seven."],["Mi lavo e mi vesto.","I wash and get dressed."],["Ci alziamo presto.","We get up early."],["Vado a dormire alle undici.","I go to sleep at eleven."]],"quiz":[{"q":"What does “mi sveglio” mean?","a":"I wake up","choices":["I go out","I wake up","I go to bed"],"why":"Svegliarsi means to wake up."}]},{"title":"A1 Review","topic":"Putting it together","rule":"Arrivederci is a standard polite goodbye.","examples":[["Come stai?","How are you?"],["Sto bene, grazie.","I am well, thank you."]],"quiz":[{"q":"Which is a polite way to say goodbye?","a":"Arrivederci","choices":["Ciao bello","Arrivederci","Prego"],"why":"Arrivederci is a standard polite goodbye."}]},{"title":"Articles and gender","topic":"il, lo, la, l’ and plural articles","rule":"Italian nouns have grammatical gender. Use il for many masculine nouns, la for many feminine nouns, lo before s+consonant or z, and l’ before a vowel. Plurals commonly use i, gli, le.","examples":[["Il ragazzo parla.","The boy speaks."],["La ragazza studia.","The girl studies."]],"quiz":[{"q":"Translate: The boy speaks.","a":"Il ragazzo parla.","choices":["Il ragazzo parla.","La ragazza studia.","Non lo so."],"why":"The model answer is “Il ragazzo parla.”. Notice the structure: il, lo, la, l’ and plural articles."},{"q":"Translate: The girl studies.","a":"La ragazza studia.","choices":["La ragazza studia.","Il ragazzo parla.","Non capisco."],"why":"The model answer is “La ragazza studia.”."}]},{"title":"Present tense -are","topic":"Regular -are verbs","rule":"For regular -are verbs, remove -are and add -o, -i, -a, -iamo, -ate, -ano. Parlare: parlo, parli, parla, parliamo, parlate, parlano.","examples":[["Io parlo italiano.","I speak Italian."],["Noi studiamo ogni giorno.","We study every day."]],"quiz":[{"q":"Translate: I speak Italian.","a":"Io parlo italiano.","choices":["Io parlo italiano.","Noi studiamo ogni giorno.","Non lo so."],"why":"The model answer is “Io parlo italiano.”. Notice the structure: Regular -are verbs."},{"q":"Translate: We study every day.","a":"Noi studiamo ogni giorno.","choices":["Noi studiamo ogni giorno.","Io parlo italiano.","Non capisco."],"why":"The model answer is “Noi studiamo ogni giorno.”."}]},{"title":"Present tense -ere","topic":"Regular -ere verbs","rule":"For regular -ere verbs, endings include -o, -i, -e, -iamo, -ete, -ono. Prendere: prendo, prendi, prende, prendiamo, prendete, prendono.","examples":[["Io prendo un caffè.","I have a coffee."],["Lei legge un libro.","She reads a book."]],"quiz":[{"q":"Translate: I have a coffee.","a":"Io prendo un caffè.","choices":["Io prendo un caffè.","Lei legge un libro.","Non lo so."],"why":"The model answer is “Io prendo un caffè.”. Notice the structure: Regular -ere verbs."},{"q":"Translate: She reads a book.","a":"Lei legge un libro.","choices":["Lei legge un libro.","Io prendo un caffè.","Non capisco."],"why":"The model answer is “Lei legge un libro.”."}]},{"title":"Present tense -ire","topic":"Regular -ire verbs","rule":"Many -ire verbs use -o, -i, -e, -iamo, -ite, -ono; some insert -isc- in singular and third-person plural: capisco, capisci, capisce, capiamo, capite, capiscono.","examples":[["Io dormo otto ore.","I sleep eight hours."],["Loro capiscono italiano.","They understand Italian."]],"quiz":[{"q":"Translate: I sleep eight hours.","a":"Io dormo otto ore.","choices":["Io dormo otto ore.","Loro capiscono italiano.","Non lo so."],"why":"The model answer is “Io dormo otto ore.”. Notice the structure: Regular -ire verbs."},{"q":"Translate: They understand Italian.","a":"Loro capiscono italiano.","choices":["Loro capiscono italiano.","Io dormo otto ore.","Non capisco."],"why":"The model answer is “Loro capiscono italiano.”."}]},{"title":"Negation and questions","topic":"Non, dove, quando, perché","rule":"Focus on the structure: Non, dove, quando, perché. Read the two examples aloud, identify the verb forms and connectors, and then produce your own sentence without looking at the translation.","examples":[["Non capisco.","I do not understand."],["Perché studi italiano?","Why do you study Italian?"]],"quiz":[{"q":"Translate: I do not understand.","a":"Non capisco.","choices":["Non capisco.","Perché studi italiano?","Non lo so."],"why":"The model answer is “Non capisco.”. Notice the structure: Non, dove, quando, perché."},{"q":"Translate: Why do you study Italian?","a":"Perché studi italiano?","choices":["Perché studi italiano?","Non capisco.","Non capisco."],"why":"The model answer is “Perché studi italiano?”."}]},{"title":"Adjectives agreement","topic":"Masculine feminine singular plural","rule":"Focus on the structure: Masculine feminine singular plural. Read the two examples aloud, identify the verb forms and connectors, and then produce your own sentence without looking at the translation.","examples":[["La casa è bella.","The house is beautiful."],["I libri sono nuovi.","The books are new."]],"quiz":[{"q":"Translate: The house is beautiful.","a":"La casa è bella.","choices":["La casa è bella.","I libri sono nuovi.","Non lo so."],"why":"The model answer is “La casa è bella.”. Notice the structure: Masculine feminine singular plural."},{"q":"Translate: The books are new.","a":"I libri sono nuovi.","choices":["I libri sono nuovi.","La casa è bella.","Non capisco."],"why":"The model answer is “I libri sono nuovi.”."}]},{"title":"Prepositions","topic":"A, in, di, da, con, per","rule":"Focus on the structure: A, in, di, da, con, per. Read the two examples aloud, identify the verb forms and connectors, and then produce your own sentence without looking at the translation.","examples":[["Vado a Roma.","I am going to Rome."],["Vivo in Italia.","I live in Italy."]],"quiz":[{"q":"Translate: I am going to Rome.","a":"Vado a Roma.","choices":["Vado a Roma.","Vivo in Italia.","Non lo so."],"why":"The model answer is “Vado a Roma.”. Notice the structure: A, in, di, da, con, per."},{"q":"Translate: I live in Italy.","a":"Vivo in Italia.","choices":["Vivo in Italia.","Vado a Roma.","Non capisco."],"why":"The model answer is “Vivo in Italia.”."}]},{"title":"Daily routines","topic":"Reflexive verbs and frequency","rule":"Focus on the structure: Reflexive verbs and frequency. Read the two examples aloud, identify the verb forms and connectors, and then produce your own sentence without looking at the translation.","examples":[["Mi sveglio alle sette.","I wake up at seven."],["Mi lavo e faccio colazione.","I wash and have breakfast."]],"quiz":[{"q":"Translate: I wake up at seven.","a":"Mi sveglio alle sette.","choices":["Mi sveglio alle sette.","Mi lavo e faccio colazione.","Non lo so."],"why":"The model answer is “Mi sveglio alle sette.”. Notice the structure: Reflexive verbs and frequency."},{"q":"Translate: I wash and have breakfast.","a":"Mi lavo e faccio colazione.","choices":["Mi lavo e faccio colazione.","Mi sveglio alle sette.","Non capisco."],"why":"The model answer is “Mi lavo e faccio colazione.”."}]},{"title":"Modal verbs","topic":"Potere, volere, dovere","rule":"Focus on the structure: Potere, volere, dovere. Read the two examples aloud, identify the verb forms and connectors, and then produce your own sentence without looking at the translation.","examples":[["Posso entrare?","May I come in?"],["Devo studiare.","I have to study."]],"quiz":[{"q":"Translate: May I come in?","a":"Posso entrare?","choices":["Posso entrare?","Devo studiare.","Non lo so."],"why":"The model answer is “Posso entrare?”. Notice the structure: Potere, volere, dovere."},{"q":"Translate: I have to study.","a":"Devo studiare.","choices":["Devo studiare.","Posso entrare?","Non capisco."],"why":"The model answer is “Devo studiare.”."}]},{"title":"A1 final integration","topic":"Everyday communication","rule":"Focus on the structure: Everyday communication. Read the two examples aloud, identify the verb forms and connectors, and then produce your own sentence without looking at the translation.","examples":[["Vorrei un biglietto per Firenze.","I would like a ticket to Florence."],["A che ora parte il treno?","What time does the train leave?"]],"quiz":[{"q":"Translate: I would like a ticket to Florence.","a":"Vorrei un biglietto per Firenze.","choices":["Vorrei un biglietto per Firenze.","A che ora parte il treno?","Non lo so."],"why":"The model answer is “Vorrei un biglietto per Firenze.”. Notice the structure: Everyday communication."},{"q":"Translate: What time does the train leave?","a":"A che ora parte il treno?","choices":["A che ora parte il treno?","Vorrei un biglietto per Firenze.","Non capisco."],"why":"The model answer is “A che ora parte il treno?”."}]},{"title":"Questions and negation","topic":"Core grammar · A1","rule":"Non precedes a conjugated verb. Yes/no questions use rising intonation; question words include chi, che cosa, dove, quando, perché and come.","examples":[["Non capisco.","I do not understand."],["Dove abiti?","Where do you live?"]],"quiz":[{"q":"Which Italian sentence means “I do not understand.”?","a":"Non capisco.","choices":["Non capisco.","Dove abiti?","Non lo so."],"why":"The correct answer is “Non capisco.”. Non precedes a conjugated verb."},{"q":"Which Italian sentence means “Where do you live?”?","a":"Dove abiti?","choices":["Dove abiti?","Non capisco.","Non capisco."],"why":"The correct answer is “Dove abiti?”."}]},{"title":"Numbers and prices","topic":"Core grammar · A1","rule":"Numbers are essential for shopping. Ventuno (21), trentadue (32), cento (100). Quanto costa? asks the price of one item; quanto costano? for plural items.","examples":[["Quanto costa questo libro?","How much does this book cost?"],["Costa venticinque euro.","It costs twenty-five euros."]],"quiz":[{"q":"Which Italian sentence means “How much does this book cost?”?","a":"Quanto costa questo libro?","choices":["Quanto costa questo libro?","Costa venticinque euro.","Non lo so."],"why":"The correct answer is “Quanto costa questo libro?”. Numbers are essential for shopping."},{"q":"Which Italian sentence means “It costs twenty-five euros.”?","a":"Costa venticinque euro.","choices":["Costa venticinque euro.","Quanto costa questo libro?","Non capisco."],"why":"The correct answer is “Costa venticinque euro.”."}]},{"title":"Time and schedules","topic":"Core grammar · A1","rule":"Use È l’una for one o’clock and Sono le... for other hours. Use alle before a time for an appointment; a mezzogiorno means at noon.","examples":[["Sono le otto e mezza.","It is eight thirty."],["Il treno parte alle nove.","The train leaves at nine."]],"quiz":[{"q":"Which Italian sentence means “It is eight thirty.”?","a":"Sono le otto e mezza.","choices":["Sono le otto e mezza.","Il treno parte alle nove.","Non lo so."],"why":"The correct answer is “Sono le otto e mezza.”. Use È l’una for one o’clock and Sono le."},{"q":"Which Italian sentence means “The train leaves at nine.”?","a":"Il treno parte alle nove.","choices":["Il treno parte alle nove.","Sono le otto e mezza.","Non capisco."],"why":"The correct answer is “Il treno parte alle nove.”."}]},{"title":"Days, months and dates","topic":"Core grammar · A1","rule":"Italian days and months are normally lowercase. Use lunedì, martedì, mercoledì, giovedì, venerdì, sabato, domenica. For dates use il + number + month, but il primo for the first.","examples":[["Oggi è lunedì.","Today is Monday."],["Il corso inizia il primo marzo.","The course starts on March first."]],"quiz":[{"q":"Which Italian sentence means “Today is Monday.”?","a":"Oggi è lunedì.","choices":["Oggi è lunedì.","Il corso inizia il primo marzo.","Non lo so."],"why":"The correct answer is “Oggi è lunedì.”. Italian days and months are normally lowercase."},{"q":"Which Italian sentence means “The course starts on March first.”?","a":"Il corso inizia il primo marzo.","choices":["Il corso inizia il primo marzo.","Oggi è lunedì.","Non capisco."],"why":"The correct answer is “Il corso inizia il primo marzo.”."}]},{"title":"Modal verbs","topic":"Core grammar · A1","rule":"Potere, volere and dovere combine with an infinitive: posso parlare, voglio mangiare, devo studiare. The modal verb agrees with the subject.","examples":[["Posso entrare?","May I come in?"],["Devo studiare stasera.","I have to study tonight."]],"quiz":[{"q":"Which Italian sentence means “May I come in?”?","a":"Posso entrare?","choices":["Posso entrare?","Devo studiare stasera.","Non lo so."],"why":"The correct answer is “Posso entrare?”. Potere, volere and dovere combine with an infinitive: posso parlare, voglio mangiare, devo studiare."},{"q":"Which Italian sentence means “I have to study tonight.”?","a":"Devo studiare stasera.","choices":["Devo studiare stasera.","Posso entrare?","Non capisco."],"why":"The correct answer is “Devo studiare stasera.”."}]},{"title":"Adjectives and agreement","topic":"Core grammar · A1","rule":"Most adjectives agree in gender and number with the noun: ragazzo alto, ragazza alta, ragazzi alti, ragazze alte. Some adjectives ending in -e have plural -i.","examples":[["La casa è piccola.","The house is small."],["I libri sono interessanti.","The books are interesting."]],"quiz":[{"q":"Which Italian sentence means “The house is small.”?","a":"La casa è piccola.","choices":["La casa è piccola.","I libri sono interessanti.","Non lo so."],"why":"The correct answer is “La casa è piccola.”. Most adjectives agree in gender and number with the noun: ragazzo alto, ragazza alta, ragazzi alti, ragazze alte."},{"q":"Which Italian sentence means “The books are interesting.”?","a":"I libri sono interessanti.","choices":["I libri sono interessanti.","La casa è piccola.","Non capisco."],"why":"The correct answer is “I libri sono interessanti.”."}]},{"title":"Possessives","topic":"Core grammar · A1","rule":"Possessives usually take the article: il mio libro, la tua casa, i nostri amici. Singular unmodified family nouns usually omit the article: mia madre.","examples":[["Questo è il mio telefono.","This is my phone."],["Mio fratello vive qui.","My brother lives here."]],"quiz":[{"q":"Which Italian sentence means “This is my phone.”?","a":"Questo è il mio telefono.","choices":["Questo è il mio telefono.","Mio fratello vive qui.","Non lo so."],"why":"The correct answer is “Questo è il mio telefono.”. Possessives usually take the article: il mio libro, la tua casa, i nostri amici."},{"q":"Which Italian sentence means “My brother lives here.”?","a":"Mio fratello vive qui.","choices":["Mio fratello vive qui.","Questo è il mio telefono.","Non capisco."],"why":"The correct answer is “Mio fratello vive qui.”."}]},{"title":"Simple prepositions","topic":"Core grammar · A1","rule":"Common prepositions: a (to/in), in (in/to), di (of/from), da (from/at), con (with), per (for), su (on). Learn combinations through examples.","examples":[["Vado a scuola.","I go to school."],["Abito in Italia.","I live in Italy."]],"quiz":[{"q":"Which Italian sentence means “I go to school.”?","a":"Vado a scuola.","choices":["Vado a scuola.","Abito in Italia.","Non lo so."],"why":"The correct answer is “Vado a scuola.”. Common prepositions: a (to/in), in (in/to), di (of/from), da (from/at), con (with), per (for), su (on)."},{"q":"Which Italian sentence means “I live in Italy.”?","a":"Abito in Italia.","choices":["Abito in Italia.","Vado a scuola.","Non capisco."],"why":"The correct answer is “Abito in Italia.”."}]},{"title":"Past with avere","topic":"Core grammar · A1","rule":"Passato prossimo uses present tense avere plus past participle: ho parlato, hai mangiato, abbiamo visto. Many transitive verbs use avere.","examples":[["Ho comprato il pane.","I bought the bread."],["Abbiamo visitato Roma.","We visited Rome."]],"quiz":[{"q":"Which Italian sentence means “I bought the bread.”?","a":"Ho comprato il pane.","choices":["Ho comprato il pane.","Abbiamo visitato Roma.","Non lo so."],"why":"The correct answer is “Ho comprato il pane.”. Passato prossimo uses present tense avere plus past participle: ho parlato, hai mangiato, abbiamo visto."},{"q":"Which Italian sentence means “We visited Rome.”?","a":"Abbiamo visitato Roma.","choices":["Abbiamo visitato Roma.","Ho comprato il pane.","Non capisco."],"why":"The correct answer is “Abbiamo visitato Roma.”."}]},{"title":"Past with essere","topic":"Core grammar · A1","rule":"Movement and change-of-state verbs often use essere: sono andato/a, siamo arrivati/e. With essere, the participle agrees with the subject.","examples":[["Maria è arrivata ieri.","Maria arrived yesterday."],["Siamo andati al cinema.","We went to the cinema."]],"quiz":[{"q":"Which Italian sentence means “Maria arrived yesterday.”?","a":"Maria è arrivata ieri.","choices":["Maria è arrivata ieri.","Siamo andati al cinema.","Non lo so."],"why":"The correct answer is “Maria è arrivata ieri.”. Movement and change-of-state verbs often use essere: sono andato/a, siamo arrivati/e."},{"q":"Which Italian sentence means “We went to the cinema.”?","a":"Siamo andati al cinema.","choices":["Siamo andati al cinema.","Maria è arrivata ieri.","Non capisco."],"why":"The correct answer is “Siamo andati al cinema.”."}]},{"title":"Direct object basics","topic":"Core grammar · A1","rule":"Direct objects answer whom or what. Before a conjugated verb, mi, ti, lo, la, ci, vi, li, le can replace the noun. Lo vedo means I see him/it.","examples":[["Compro il libro.","I buy the book."],["Lo compro domani.","I will buy it tomorrow."]],"quiz":[{"q":"Which Italian sentence means “I buy the book.”?","a":"Compro il libro.","choices":["Compro il libro.","Lo compro domani.","Non lo so."],"why":"The correct answer is “Compro il libro.”. Direct objects answer whom or what."},{"q":"Which Italian sentence means “I will buy it tomorrow.”?","a":"Lo compro domani.","choices":["Lo compro domani.","Compro il libro.","Non capisco."],"why":"The correct answer is “Lo compro domani.”."}]},{"title":"A1 real-life conversation","topic":"Core grammar · A1","rule":"Combine greetings, polite requests, prices, times and directions. Speak in complete exchanges rather than isolated vocabulary.","examples":[["Buongiorno, vorrei due biglietti.","Good morning, I would like two tickets."],["A che ora parte il treno?","What time does the train leave?"]],"quiz":[{"q":"Which Italian sentence means “Good morning, I would like two tickets.”?","a":"Buongiorno, vorrei due biglietti.","choices":["Buongiorno, vorrei due biglietti.","A che ora parte il treno?","Non lo so."],"why":"The correct answer is “Buongiorno, vorrei due biglietti.”. Combine greetings, polite requests, prices, times and directions."},{"q":"Which Italian sentence means “What time does the train leave?”?","a":"A che ora parte il treno?","choices":["A che ora parte il treno?","Buongiorno, vorrei due biglietti.","Non capisco."],"why":"The correct answer is “A che ora parte il treno?”."}]}],"A2":[{"title":"Past Experiences","topic":"Passato prossimo","rule":"Mangiare takes avere in the passato prossimo.","examples":[["Ho mangiato","I ate / I have eaten"],["Ieri ho visitato Roma.","Yesterday I visited Rome."]],"quiz":[{"q":"Choose the past of “mangiare” with io.","a":"Ho mangiato","choices":["Sono mangiare","Ho mangiato","Mangio ieri"],"why":"Mangiare takes avere in the passato prossimo."}]},{"title":"Travel Stories","topic":"Movement verbs in the past","rule":"Andare uses essere in compound tenses.","examples":[["Sono arrivato","I arrived (masculine speaker)"],["Siamo andati a Firenze.","We went to Florence."]],"quiz":[{"q":"Choose the auxiliary for “andare”.","a":"Essere","choices":["Avere","Essere","Fare"],"why":"Andare uses essere in compound tenses."}]},{"title":"Describing the Past","topic":"Imperfetto","rule":"Imperfetto often describes repeated or ongoing past actions.","examples":[["Da piccolo giocavo","When I was little, I used to play"],["Prima abitavo a New York.","I used to live in New York."]],"quiz":[{"q":"Which tense describes a past habit?","a":"Imperfetto","choices":["Futuro","Imperfetto","Imperativo"],"why":"Imperfetto often describes repeated or ongoing past actions."}]},{"title":"Plans & Predictions","topic":"Future simple","rule":"Partirò is the first-person future of partire.","examples":[["Partirò domani","I will leave tomorrow"],["Visiteremo Venezia.","We will visit Venice."]],"quiz":[{"q":"Complete: Domani io ___.","a":"partirò","choices":["partivo","partirò","parto ieri"],"why":"Partirò is the first-person future of partire."}]},{"title":"At the Restaurant","topic":"Polite requests","rule":"Potrei is the conditional of potere.","examples":[["Potrei avere il menù?","Could I have the menu?"],["Vorremmo un tavolo per due.","We would like a table for two."]],"quiz":[{"q":"What does “potrei” express?","a":"A polite request","choices":["A command","A polite request","A past habit"],"why":"Potrei is the conditional of potere."}]},{"title":"Shopping","topic":"Comparisons","rule":"Più costoso means more expensive.","examples":[["Più grande di","Bigger than"],["Questo costa meno.","This costs less."]],"quiz":[{"q":"How do you say “more expensive”?","a":"Più costoso","choices":["Meno caro","Più costoso","Così grande"],"why":"Più costoso means more expensive."}]},{"title":"Pronouns","topic":"Direct objects","rule":"Lo replaces a masculine singular direct object.","examples":[["Lo vedo","I see him / it"],["La conosco bene.","I know her well."]],"quiz":[{"q":"Replace “il libro” in “Leggo il libro”.","a":"Lo leggo","choices":["La leggo","Li leggo","Lo leggo"],"why":"Lo replaces a masculine singular direct object."}]},{"title":"Health","topic":"At the pharmacy","rule":"Mal di gola means a sore throat.","examples":[["Mi fa male la testa","My head hurts"],["Ho bisogno di una farmacia.","I need a pharmacy."]],"quiz":[{"q":"What does “ho mal di gola” mean?","a":"I have a sore throat","choices":["I have a fever","I have a sore throat","I have a headache"],"why":"Mal di gola means a sore throat."}]},{"title":"Giving Instructions","topic":"Imperative","rule":"Parla is the tu imperative of parlare.","examples":[["Ascolta!","Listen!"],["Prendi la seconda strada.","Take the second street."]],"quiz":[{"q":"Choose the informal singular command “Speak!”","a":"Parla!","choices":["Parliamo!","Parla!","Parlavo!"],"why":"Parla is the tu imperative of parlare."}]},{"title":"Daily Connections","topic":"Prepositions","rule":"A + il contracts to al.","examples":[["Vado al cinema","I go to the cinema"],["Vengo dalla stazione.","I am coming from the station."]],"quiz":[{"q":"Complete: Vado ___ cinema.","a":"al","choices":["dal","nel","al"],"why":"A + il contracts to al."}]},{"title":"Making Plans","topic":"Invitations","rule":"Ci vediamo is a common way to arrange a meeting.","examples":[["Ti va di uscire?","Do you feel like going out?"],["Ci vediamo alle otto.","See you at eight."]],"quiz":[{"q":"What does “ci vediamo” mean?","a":"See you","choices":["We eat","See you","We study"],"why":"Ci vediamo is a common way to arrange a meeting."}]},{"title":"A2 Review","topic":"Travel and everyday life","rule":"Mi piacerebbe expresses a hypothetical desire.","examples":[["Mi piacerebbe","I would like"],["Mi piacerebbe imparare meglio.","I would like to learn better."]],"quiz":[{"q":"Which form expresses a wish politely?","a":"Mi piacerebbe","choices":["Mi piaceva ieri","Mi piacerebbe","Mi piaccio"],"why":"Mi piacerebbe expresses a hypothetical desire."}]},{"title":"Past with avere","topic":"Passato prossimo and participles","rule":"Passato prossimo uses a present-tense auxiliary plus past participle. Many transitive verbs use avere: ho mangiato, hai mangiato, ha mangiato.","examples":[["Ho mangiato una pizza.","I ate a pizza."],["Abbiamo visto un film.","We watched a movie."]],"quiz":[{"q":"Translate: I ate a pizza.","a":"Ho mangiato una pizza.","choices":["Ho mangiato una pizza.","Abbiamo visto un film.","Non lo so."],"why":"The model answer is “Ho mangiato una pizza.”. Notice the structure: Passato prossimo and participles."},{"q":"Translate: We watched a movie.","a":"Abbiamo visto un film.","choices":["Abbiamo visto un film.","Ho mangiato una pizza.","Non capisco."],"why":"The model answer is “Abbiamo visto un film.”."}]},{"title":"Past with essere","topic":"Movement and agreement","rule":"Many verbs of movement and change use essere in the passato prossimo. The participle agrees with the subject: sono arrivato / arrivata.","examples":[["Sono arrivato ieri.","I arrived yesterday."],["Maria è partita presto.","Maria left early."]],"quiz":[{"q":"Translate: I arrived yesterday.","a":"Sono arrivato ieri.","choices":["Sono arrivato ieri.","Maria è partita presto.","Non lo so."],"why":"The model answer is “Sono arrivato ieri.”. Notice the structure: Movement and agreement."},{"q":"Translate: Maria left early.","a":"Maria è partita presto.","choices":["Maria è partita presto.","Sono arrivato ieri.","Non capisco."],"why":"The model answer is “Maria è partita presto.”."}]},{"title":"Imperfect tense","topic":"Habits and background in the past","rule":"Imperfetto describes repeated past habits, ongoing past states, and background. Contrast it with passato prossimo for completed events.","examples":[["Da bambino giocavo fuori.","As a child I used to play outside."],["Pioveva quando sono uscito.","It was raining when I went out."]],"quiz":[{"q":"Translate: As a child I used to play outside.","a":"Da bambino giocavo fuori.","choices":["Da bambino giocavo fuori.","Pioveva quando sono uscito.","Non lo so."],"why":"The model answer is “Da bambino giocavo fuori.”. Notice the structure: Habits and background in the past."},{"q":"Translate: It was raining when I went out.","a":"Pioveva quando sono uscito.","choices":["Pioveva quando sono uscito.","Da bambino giocavo fuori.","Non capisco."],"why":"The model answer is “Pioveva quando sono uscito.”."}]},{"title":"Direct object pronouns","topic":"Lo, la, li, le","rule":"Focus on the structure: Lo, la, li, le. Read the two examples aloud, identify the verb forms and connectors, and then produce your own sentence without looking at the translation.","examples":[["Lo conosco bene.","I know him well."],["La vedo domani.","I will see her tomorrow."]],"quiz":[{"q":"Translate: I know him well.","a":"Lo conosco bene.","choices":["Lo conosco bene.","La vedo domani.","Non lo so."],"why":"The model answer is “Lo conosco bene.”. Notice the structure: Lo, la, li, le."},{"q":"Translate: I will see her tomorrow.","a":"La vedo domani.","choices":["La vedo domani.","Lo conosco bene.","Non capisco."],"why":"The model answer is “La vedo domani.”."}]},{"title":"Indirect object pronouns","topic":"Mi, ti, gli, le, ci, vi","rule":"Focus on the structure: Mi, ti, gli, le, ci, vi. Read the two examples aloud, identify the verb forms and connectors, and then produce your own sentence without looking at the translation.","examples":[["Gli scrivo stasera.","I will write to him tonight."],["Le telefono domani.","I will call her tomorrow."]],"quiz":[{"q":"Translate: I will write to him tonight.","a":"Gli scrivo stasera.","choices":["Gli scrivo stasera.","Le telefono domani.","Non lo so."],"why":"The model answer is “Gli scrivo stasera.”. Notice the structure: Mi, ti, gli, le, ci, vi."},{"q":"Translate: I will call her tomorrow.","a":"Le telefono domani.","choices":["Le telefono domani.","Gli scrivo stasera.","Non capisco."],"why":"The model answer is “Le telefono domani.”."}]},{"title":"Comparisons","topic":"Più, meno, come, di","rule":"Focus on the structure: Più, meno, come, di. Read the two examples aloud, identify the verb forms and connectors, and then produce your own sentence without looking at the translation.","examples":[["Roma è più grande di Siena.","Rome is bigger than Siena."],["Questo è meno caro.","This is less expensive."]],"quiz":[{"q":"Translate: Rome is bigger than Siena.","a":"Roma è più grande di Siena.","choices":["Roma è più grande di Siena.","Questo è meno caro.","Non lo so."],"why":"The model answer is “Roma è più grande di Siena.”. Notice the structure: Più, meno, come, di."},{"q":"Translate: This is less expensive.","a":"Questo è meno caro.","choices":["Questo è meno caro.","Roma è più grande di Siena.","Non capisco."],"why":"The model answer is “Questo è meno caro.”."}]},{"title":"Future tense","topic":"Futuro semplice","rule":"Focus on the structure: Futuro semplice. Read the two examples aloud, identify the verb forms and connectors, and then produce your own sentence without looking at the translation.","examples":[["Domani partirò.","I will leave tomorrow."],["Studieremo insieme.","We will study together."]],"quiz":[{"q":"Translate: I will leave tomorrow.","a":"Domani partirò.","choices":["Domani partirò.","Studieremo insieme.","Non lo so."],"why":"The model answer is “Domani partirò.”. Notice the structure: Futuro semplice."},{"q":"Translate: We will study together.","a":"Studieremo insieme.","choices":["Studieremo insieme.","Domani partirò.","Non capisco."],"why":"The model answer is “Studieremo insieme.”."}]},{"title":"Conditional polite requests","topic":"Vorrei and potrei","rule":"Focus on the structure: Vorrei and potrei. Read the two examples aloud, identify the verb forms and connectors, and then produce your own sentence without looking at the translation.","examples":[["Vorrei prenotare un tavolo.","I would like to book a table."],["Potresti aiutarmi?","Could you help me?"]],"quiz":[{"q":"Translate: I would like to book a table.","a":"Vorrei prenotare un tavolo.","choices":["Vorrei prenotare un tavolo.","Potresti aiutarmi?","Non lo so."],"why":"The model answer is “Vorrei prenotare un tavolo.”. Notice the structure: Vorrei and potrei."},{"q":"Translate: Could you help me?","a":"Potresti aiutarmi?","choices":["Potresti aiutarmi?","Vorrei prenotare un tavolo.","Non capisco."],"why":"The model answer is “Potresti aiutarmi?”."}]},{"title":"Relative clauses","topic":"Che and cui","rule":"Focus on the structure: Che and cui. Read the two examples aloud, identify the verb forms and connectors, and then produce your own sentence without looking at the translation.","examples":[["Il libro che leggo è bello.","The book I am reading is good."],["La persona con cui parlo è gentile.","The person I am talking with is kind."]],"quiz":[{"q":"Translate: The book I am reading is good.","a":"Il libro che leggo è bello.","choices":["Il libro che leggo è bello.","La persona con cui parlo è gentile.","Non lo so."],"why":"The model answer is “Il libro che leggo è bello.”. Notice the structure: Che and cui."},{"q":"Translate: The person I am talking with is kind.","a":"La persona con cui parlo è gentile.","choices":["La persona con cui parlo è gentile.","Il libro che leggo è bello.","Non capisco."],"why":"The model answer is “La persona con cui parlo è gentile.”."}]},{"title":"A2 final integration","topic":"Travel, work and narration","rule":"Focus on the structure: Travel, work and narration. Read the two examples aloud, identify the verb forms and connectors, and then produce your own sentence without looking at the translation.","examples":[["Ieri ho perso il treno.","Yesterday I missed the train."],["Potrebbe indicarmi la strada?","Could you show me the way?"]],"quiz":[{"q":"Translate: Yesterday I missed the train.","a":"Ieri ho perso il treno.","choices":["Ieri ho perso il treno.","Potrebbe indicarmi la strada?","Non lo so."],"why":"The model answer is “Ieri ho perso il treno.”. Notice the structure: Travel, work and narration."},{"q":"Translate: Could you show me the way?","a":"Potrebbe indicarmi la strada?","choices":["Potrebbe indicarmi la strada?","Ieri ho perso il treno.","Non capisco."],"why":"The model answer is “Potrebbe indicarmi la strada?”."}]},{"title":"Imperfetto forms","topic":"Core grammar · A2","rule":"Imperfetto describes habitual or ongoing past situations. Regular endings: -vo, -vi, -va, -vamo, -vate, -vano. Essere is ero, eri, era, eravamo, eravate, erano.","examples":[["Da piccolo giocavo qui.","As a child I used to play here."],["Ieri pioveva.","It was raining yesterday."]],"quiz":[{"q":"Which Italian sentence means “As a child I used to play here.”?","a":"Da piccolo giocavo qui.","choices":["Da piccolo giocavo qui.","Ieri pioveva.","Non lo so."],"why":"The correct answer is “Da piccolo giocavo qui.”. Imperfetto describes habitual or ongoing past situations."},{"q":"Which Italian sentence means “It was raining yesterday.”?","a":"Ieri pioveva.","choices":["Ieri pioveva.","Da piccolo giocavo qui.","Non capisco."],"why":"The correct answer is “Ieri pioveva.”."}]},{"title":"Imperfetto vs passato prossimo","topic":"Core grammar · A2","rule":"Imperfetto gives background, repeated actions and states; passato prossimo presents completed events. The two often occur together.","examples":[["Mentre studiavo, è arrivato Luca.","While I was studying, Luca arrived."],["Ieri ho finito il lavoro.","Yesterday I finished the work."]],"quiz":[{"q":"Which Italian sentence means “While I was studying, Luca arrived.”?","a":"Mentre studiavo, è arrivato Luca.","choices":["Mentre studiavo, è arrivato Luca.","Ieri ho finito il lavoro.","Non lo so."],"why":"The correct answer is “Mentre studiavo, è arrivato Luca.”. Imperfetto gives background, repeated actions and states; passato prossimo presents completed events."},{"q":"Which Italian sentence means “Yesterday I finished the work.”?","a":"Ieri ho finito il lavoro.","choices":["Ieri ho finito il lavoro.","Mentre studiavo, è arrivato Luca.","Non capisco."],"why":"The correct answer is “Ieri ho finito il lavoro.”."}]},{"title":"Future tense","topic":"Core grammar · A2","rule":"Regular future endings are -ò, -ai, -à, -emo, -ete, -anno. Parlare becomes parlerò; essere and avere become sarò and avrò.","examples":[["Domani partirò presto.","Tomorrow I will leave early."],["Avremo tempo sabato.","We will have time on Saturday."]],"quiz":[{"q":"Which Italian sentence means “Tomorrow I will leave early.”?","a":"Domani partirò presto.","choices":["Domani partirò presto.","Avremo tempo sabato.","Non lo so."],"why":"The correct answer is “Domani partirò presto.”. Regular future endings are -ò, -ai, -à, -emo, -ete, -anno."},{"q":"Which Italian sentence means “We will have time on Saturday.”?","a":"Avremo tempo sabato.","choices":["Avremo tempo sabato.","Domani partirò presto.","Non capisco."],"why":"The correct answer is “Avremo tempo sabato.”."}]},{"title":"Conditional for politeness","topic":"Core grammar · A2","rule":"The present conditional softens requests and expresses hypothetical wishes. Vorrei, potrei and dovrei are common irregular forms.","examples":[["Potresti aiutarmi?","Could you help me?"],["Vorrei prenotare un tavolo.","I would like to reserve a table."]],"quiz":[{"q":"Which Italian sentence means “Could you help me?”?","a":"Potresti aiutarmi? ructure: Academic and professional fluency."},{"q":"Translate: It would be desirable to act immediately.","a":"Sarebbe auspicabile intervenire subito.","choices":["Sarebbe auspicabile intervenire subito.","Pur riconoscendo i vantaggi, nutro dei dubbi.","Non capisco."],"why":"The model answer is “Sarebbe auspicabile intervenire subito.”."}]},{"title":"Subjunctive sequence of tenses","topic":"Core grammar · B2","rule":"With a past main verb, dependent actions simultaneous with it commonly use imperfect subjunctive; earlier actions use pluperfect subjunctive.","examples":[["Pensavo che fosse pronto.","I thought he was ready."],["Credevo che avesse già finito.","I thought he had already finished."]],"quiz":[{"q":"Which Italian sentence means “I thought he was ready.”?","a":"Pensavo che fosse pronto.","choices":["Pensavo che fosse pronto.","Credevo che avesse già finito.","Non lo so."],"why":"The correct answer is “Pensavo che fosse pronto.”. With a past main verb, dependent actions simultaneous with it commonly use imperfect subjunctive; earlier actions use pluperfect subjunctive."},{"q":"Which Italian sentence means “I thought he had already finished.”?","a":"Credevo che avesse già finito.","choices":["Credevo che avesse già finito.","Pensavo che fosse pronto.","Non capisco."],"why":"The correct answer is “Credevo che avesse già finito.”."}]},{"title":"Past hypothetical conditions","topic":"Core grammar · B2","rule":"Past unreal conditions use se + pluperfect subjunctive and past conditional. These express an unreal past and its imagined consequence.","examples":[["Se avessi studiato, avrei superato l’esame.","If I had studied, I would have passed the exam."],["Se fossimo partiti prima, saremmo arrivati in orario.","If we had left earlier, we would have arrived on time."]],"quiz":[{"q":"Which Italian sentence means “If I had studied, I would have passed the exam.”?","a":"Se avessi studiato, avrei superato l’esame.","choices":["Se avessi studiato, avrei superato l’esame.","Se fossimo partiti prima, saremmo arrivati in orario.","Non lo so."],"why":"The correct answer is “Se avessi studiato, avrei superato l’esame.”. Past unreal conditions use se + pluperfect subjunctive and past conditional."},{"q":"Which Italian sentence means “If we had left earlier, we would have arrived on time.”?","a":"Se fossimo partiti prima, saremmo arrivati in orario.","choices":["Se fossimo partiti prima, saremmo arrivati in orario.","Se avessi studiato, avrei superato l’esame.","Non capisco."],"why":"The correct answer is “Se fossimo partiti prima, saremmo arrivati in orario.”."}]},{"title":"Mixed conditionals","topic":"Core grammar · B2","rule":"A past unreal condition can produce a present consequence: se avessi accettato, ora lavorerei lì. Pay attention to the two time frames.","examples":[["Se avessi dormito, ora starei meglio.","If I had slept, I would feel better now."],["Se avessi preso il treno, sarei già lì.","If I had taken the train, I would already be there."]],"quiz":[{"q":"Which Italian sentence means “If I had slept, I would feel better now.”?","a":"Se avessi dormito, ora starei meglio.","choices":["Se avessi dormito, ora starei meglio.","Se avessi preso il treno, sarei già lì.","Non lo so."],"why":"The correct answer is “Se avessi dormito, ora starei meglio.”. A past unreal condition can produce a present consequence: se avessi accettato, ora lavorerei lì."},{"q":"Which Italian sentence means “If I had taken the train, I would already be there.”?","a":"Se avessi preso il treno, sarei già lì.","choices":["Se avessi preso il treno, sarei già lì.","Se avessi dormito, ora starei meglio.","Non capisco."],"why":"The correct answer is “Se avessi preso il treno, sarei già lì.”."}]},{"title":"Concessive clauses","topic":"Core grammar · B2","rule":"Benché, sebbene and nonostante introduce concession and commonly take the subjunctive. Anche se usually takes the indicative for factual information.","examples":[["Benché sia tardi, continueremo.","Although it is late, we will continue."],["Anche se piove, usciamo.","Even though it is raining, we are going out."]],"quiz":[{"q":"Which Italian sentence means “Although it is late, we will continue.”?","a":"Benché sia tardi, continueremo.","choices":["Benché sia tardi, continueremo.","Anche se piove, usciamo.","Non lo so."],"why":"The correct answer is “Benché sia tardi, continueremo.”. Benché, sebbene and nonostante introduce concession and commonly take the subjunctive."},{"q":"Which Italian sentence means “Even though it is raining, we are going out.”?","a":"Anche se piove, usciamo.","choices":["Anche se piove, usciamo.","Benché sia tardi, continueremo.","Non capisco."],"why":"The correct answer is “Anche se piove, usciamo.”."}]},{"title":"Purpose clauses","topic":"Core grammar · B2","rule":"Affinché and perché expressing purpose require the subjunctive when subjects differ; per + infinitive is common when the subject is the same.","examples":[["Te lo spiego affinché tu capisca.","I explain it so that you understand."],["Studio per migliorare.","I study to improve."]],"quiz":[{"q":"Which Italian sentence means “I explain it so that you understand.”?","a":"Te lo spiego affinché tu capisca.","choices":["Te lo spiego affinché tu capisca.","Studio per migliorare.","Non lo so."],"why":"The correct answer is “Te lo spiego affinché tu capisca.”. Affinché and perché expressing purpose require the subjunctive when subjects differ; per + infinitive is common when the subject is the same."},{"q":"Which Italian sentence means “I study to improve.”?","a":"Studio per migliorare.","choices":["Studio per migliorare.","Te lo spiego affinché tu capisca.","Non capisco."],"why":"The correct answer is “Studio per migliorare.”."}]},{"title":"Gerund and progressive","topic":"Core grammar · B2","rule":"Stare + gerund expresses an ongoing action. The gerund can also indicate manner or a simultaneous action; avoid confusing it with the English -ing form in every context.","examples":[["Sto function speak(t){if(!('speechSynthesis' in window)){alert('Speech is unavailable in this browser.');return}voices();speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.86;u.pitch=1;if(voice)u.voice=voice;speechSynthesis.speak(u)}
document.addEventListener('click',function(ev){var b=ev.target.closest('[data-act],[data-level],[data-lesson],[data-choice],[data-exam],[data-audio],[data-say]');if(!b)return;if(b.hasAttribute('data-say')){speak(b.getAttribute('data-say'));return}if(b.hasAttribute('data-audio')){speak(current().examples[+b.getAttribute('data-audio')][0]);return}if(b.hasAttribute('data-level')){st.level=b.getAttribute('data-level');render();return}if(b.hasAttribute('data-lesson')){st.index=+b.getAttribute('data-lesson');go('lesson');return}if(b.hasAttribute('data-exam')){st.exam=+b.getAttribute('data-exam');st.mode='exam';st.question=0;st.score=0;go('quiz');return}if(b.hasAttribute('data-choice')){if(!st.checked){st.selected=+b.getAttribute('data-choice');render()}return}var a=b.getAttribute('data-act');if(a==='back'){go(st.page==='lesson'||st.page==='quiz'?'learn':'home')}else if(a==='startquiz'){st.mode='lesson';st.question=0;st.score=0;go('quiz')}else if(a==='check'){if(st.selected<0)return;var q=(st.mode==='exam'?examSet():quizSet())[st.question];if(q.choices[st.selected]===q.a)st.score++;st.checked=true;render()}else if(a==='next'){st.question++;st.checked=false;st.selected=-1;render()}else if(a==='restart'){st.question=0;st.score=0;go('quiz')}else if(a==='backup'){var blob=new Blob([JSON.stringify(progress,null,2)],{type:'application/json'});var url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='luke-italian-progress.json';link.click();setTimeout(function(){URL.revokeObjectURL(url)},3000)}else if(a)go(a)});
render();})();
