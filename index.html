function nav(){const names=[['home','Home'],['learn','Learn'],['explore','Explore'],['exams','Exams'],['profile','Profile']];$('#nav').innerHTML=names.map(([id,n])=>`<button class="${state.page===id?'active':''}" onclick="go('${id}')"><svg viewBox="0 0 24 24">${ICONS[id]}</svg>${n}</button>`).join('')};function go(page){state.page=page;state.choice=null;state.done=false;render();scrollTo(0,0)}function top(title){return `<div class="top"><button class="back" onclick="go('${state.page==='lesson'?'learn':state.page==='test'?'exams':state.page==='story'?'explore':'home'}')">‹</button><h1>${title}</h1></div>`}
function home(){const d=totalDone();return `<div class="hero hero-photo"><div class="eyebrow">YOUR PASSPORT TO ITALY <span style="float:right">✦ A1—B2</span></div><h1>Ciao, Luke.<br>Andiamo!</h1><p>Learn real Italian, one beautiful moment at a time.</p><button class="btn" style="background:#e8b87d;color:#163d31" onclick="go('learn')">Continue learning →</button></div><div class="welcome-strip"><span>✦ PERSONALIZED FOR LUKE</span><strong>Every day, a little more Italian.</strong></div><div class="section"><h2>Your journey</h2><span class="pill">A1 → B2</span></div><div class="card"><div class="row between"><div><b>${d} of 48 lessons</b><div class="muted small" style="margin-top:5px">Keep your momentum going</div></div><span class="pill">${pct(d,48)}%</span></div><div class="progress"><div style="width:${pct(d,48)}%"></div></div></div><div class="section"><h2>Discover Italy</h2><span class="muted small">Learn through life</span></div>${photo('rome','<span class="eyebrow">FEATURED ADVENTURE</span><h3>A morning in Rome</h3><span class="small">Order like a local →</span>',220)}<div style="height:10px"></div><button class="btn full" onclick="state.adventure=0;state.step=0;go('story')">Start this adventure</button><div class="section"><h2>Practice makes progress</h2></div><div class="level-grid"><button class="level" onclick="go('exams')"><strong>120</strong><span>Practice exam forms →</span></button><button class="level" onclick="go('explore')"><strong>4</strong><span>Italian city adventures →</span></button></div><p class="footer-note">Made for Luke · Learn Italian from English</p>`}
function learn(){return `${top('Learn Italian')}<p class="muted small">48 structured lessons across four CEFR levels. Each lesson includes an example, vocabulary, listening and a knowledge check.</p><div class="tabs">${LEVELS.map(l=>`<button class="${state.level===l?'on':''}" onclick="state.level='${l}';render()">${l}</button>`).join('')}</div><div class="card"><div class="row between"><div><div class="eyebrow" style="color:#668679">LEVEL ${state.level}</div><h2 style="font:normal 26px Georgia,serif;margin:7px 0">${{A1:'The foundations',A2:'Everyday independence',B1:'Confident conversations',B2:'Express yourself'}[state.level]}</h2></div><span class="pill">${DATA[state.level].filter((_,i)=>saved.completed[state.level+'-'+i]).length}/12</span></div><div class="progress"><div style="width:${pct(DATA[state.level].filter((_,i)=>saved.completed[state.level+'-'+i]).length,12)}%"></div></div>${DATA[state.level].map((x,i)=>`<div class="lesson" onclick="state.lesson=${i};go('lesson')"><div class="num">${saved.completed[state.level+'-'+i]?'✓':i+1}</div><div class="grow"><strong>${esc(x[0])}</strong><p>${esc(x[1])}</p></div><span>›</span></div>`).join('')}</div>`}
function speak(text){if(!('speechSynthesis'in window)){alert('Speech synthesis is not supported by this browser.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='it-IT';u.rate=.83;const voices=speechSynthesis.getVoices();const v=voices.find(v=>v.lang.toLowerCase().startsWith('it'));if(v)u.voice=v;speechSynthesis.speak(u)}
function lesson(){const x=DATA[state.level][state.lesson];return `${top('Lesson ${state.lesson+1} · ${state.level}')}<div class="eyebrow" style="color:#668679">${esc(x[1])}</div><h2 style="font:normal 34px Georgia,serif;margin:12px 0 20px">${esc(x[0])}</h2><div class="card"><div class="row between"><span class="eyebrow" style="color:#688679">SAY IT IN ITALIAN</span><button class="sound" aria-label="Hear Italian pronunciation" onclick="speak('${x[2].replace(/'/g,"\\'")}')">♫</button></div><div class="italian" style="margin:18px 0 8px">${esc(x[2])}</div><div class="muted">${esc(x[3])}</div></div><div class="card"><span class="eyebrow" style="color:#668679">IN CONTEXT</span><p class="italian" style="font-size:23px">${esc(x[4])}</p><p class="muted">${esc(x[5])}</p><button class="btn alt" onclick="speak(DATA['${state.level}'][${state.lesson}][4])">♫ Listen to the sentence</button></div><div class="section"><h2>Check your understanding</h2></div><div class="card"><b>${esc(x[6])}</b><div class="choices">${x[8].map((c,i)=>`<button class="choice ${state.choice===i?'selected':''} ${state.done?(c===x[7]?'correct':state.choice===i?'wrong':''):''}" onclick="state.choice=${i};render()" ${state.done?'disabled':''}>${esc(c)}</button>`).join('')}</div>${state.done?`<div class="explain"><b>${x[8][state.choice]===x[7]?'Correct!':'Not quite.'}</b><br>${esc(x[9])}</div><button class="btn full" onclick="completeLesson()">Complete lesson →</button>`:`<button class="btn full" ${state.choice===null?'disabled':''} onclick="state.done=true;render()">Check answer</button>`}</div>`}
function completeLesson(){saved.completed[state.level+'-'+state.lesson]=true;save();state.choice=null;state.done=false;if(state.lesson<11){state.lesson++;render();scrollTo(0,0)}else go('learn')}
const STORIES=[{city:'Rome',img:'rome',title:'A morning in Rome',intro:'You step into a bustling Roman café. The barista smiles.',dialog:[['Barista','Buongiorno! Cosa desidera?','Good morning! What would you like?','Un cappuccino, per favore.',['Un cappuccino, per favore.','Dove abita?','Non lo so.']],['Barista','Ecco il suo cappuccino. Sono tre euro.','Here is your cappuccino. That is three euros.','Grazie mille!',['Grazie mille!','Sono di New York.','Buonanotte!']],['Barista','Buona giornata!','Have a nice day!','Anche a lei!',['Anche a lei!','Non capisco.','Quanto tempo?']]]}, {city:'Venice',img:'venice',title:'Lost in Venice',intro:'You need to find the train station.',dialog:[['Local','Buongiorno, ha bisogno di aiuto?','Good morning, do you need help?','Dov’è la stazione?',['Dov’è la stazione?','Quanto costa il pane?','Mi chiamo Luca.']],['Local','Vada sempre dritto.','Go straight ahead.','Grazie per l’aiuto!',['Grazie per l’aiuto!','Un caffè, grazie.','Ho fame.']]]},{city:'Florence',img:'florence',title:'An afternoon in Florence',intro:'You enter a small art museum.',dialog:[['Staff','Ha un biglietto?','Do you have a ticket?','Vorrei un biglietto.',['Vorrei un biglietto.','Sono stanco.','Dov’è il mare?']],['Staff','Sono dieci euro.','It is ten euros.','Ecco a lei.',['Ecco a lei.','Buonanotte.','Ho venti anni.']]]},{city:'The Amalfi Coast',img:'coast',title:'A seaside dinner',intro:'A waiter comes to your table overlooking the sea.',dialog:[['Waiter','Buonasera! Avete prenotato?','Good evening! Do you have a reservation?','Sì, a nome Luke.',['Sì, a nome Luke.','Non ho sete.','Sono le otto.']],['Waiter','Preferite acqua naturale o frizzante?','Would you prefer still or sparkling water?','Acqua naturale, grazie.',['Acqua naturale, grazie.','Non parlo inglese.','Sono a casa.']]]}];
function explore(){return `${top('Explore Italy')}<p class="muted small">Interactive mini-stories. Read, listen and choose what to say next.</p><div class="photo-grid">${STORIES.map((s,i)=>`<div onclick="state.adventure=${i};state.step=0;go('story')">${photo(s.img,`<span class="eyebrow">ADVENTURE ${i+1}</span><h3>${esc(s.city)}</h3>`,215)}<p style="font-size:13px;font-weight:700;margin:9px 4px">${esc(s.title)} →</p></div>`).join('')}</div>`}
function story(){const s=STORIES[state.adventure],step=state.step,item=s.dialog[step];return `${top(s.city)}${photo(s.img,`<span class="eyebrow">ITALIAN ADVENTURE</span><h3>${esc(s.title)}</h3>`,185)}<div class="card"><p class="muted small">${esc(s.intro)}</p><span class="pill">Scene ${step+1} of ${s.dialog.length}</span><div class="row between" style="margin-top:18px"><b>${esc(item[0])} says:</b><button class="sound" onclick="speak(STORIES[${state.adventure}].dialog[${step}][1])">♫</button></div><p class="italian" style="font-size:23px">“${esc(item[1])}”</p><p class="muted small">${esc(item[2])}</p><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><b>What would you say?</b><div class="choices">${item[4].map((c,i)=>`<button class="choice ${state.choice===i?'selected':''} ${state.done?(c===item[3]?'correct':state.choice===i?'wrong':''):''}" onclick="state.choice=${i};render()" ${state.done?'disabled':''}>${esc(c)}</button>`).join('')}</div>${state.done?`<div class="explain">${item[4][state.choice]===item[3]?'Perfect response!':'A more natural response is: '+esc(item[3])}</div><button class="btn full" onclick="nextStory()">${step===s.dialog.length-1?'Finish adventure':'Continue story'} →</button>`:`<button class="btn full" ${state.choice===null?'disabled':''} onclick="state.done=true;render()">Respond</button>`}</div>`}
function nextStory(){state.choice=null;state.done=false;if(state.step+1<STORIES[state.adventure].dialog.length){state.step++;render()}else{alert('Bravissimo! Adventure completed.');go('explore')}}
// Every form uses its own deterministic mix/order of curated items. These are practice forms, not certified exam replicas.
function questions(level,form){const pool=DATA[level];let qs=[];for(let i=0;i<12;i++){let idx=(i*5+form*7+Math.floor(form/3))%12;let x=pool[idx];let options=[...x[8]];let shift=(form+i)%3;options=options.slice(shift).concat(options.slice(0,shift));qs.push({prompt:x[6],answer:x[7],options,why:x[9],example:x[4],translation:x[5],key:idx})}return qs}
function exams(){return `${top('Exam Academy')}<p class="muted small">120 practice forms · 30 per level · 12 auto-graded questions per form. These are original grammar and vocabulary practice quizzes, not official CILS or CELI papers.</p><div class="tabs">${LEVELS.map(l=>`<button class="${state.level===l?'on':''}" onclick="state.level='${l}';render()">${l}</button>`).join('')}</div><div class="card"><div class="row between"><div><span class="eyebrow" style="color:#668679">${state.level} PRACTICE</span><h2 style="font:normal 27px Georgia,serif;margin:8px 0">30 Exam Forms</h2></div><span class="pill">${Object.keys(saved.exams).filter(k=>k.startsWith(state.level+'-')).length} taken</span></div><p class="notice">Each form draws from the level's 12 reviewed lesson checks with different combinations and answer ordering. The forms are not 30 independently authored full-length examinations.</p>${Array.from({length:30},(_,i)=>`<div class="lesson" onclick="startExam(${i})"><div class="num">${String(i+1).padStart(2,'0')}</div><div class="grow"><strong>Practice Form ${String(i+1).padStart(2,'0')}</strong><p>12 questions · ${saved.exams[state.level+'-'+i]?'Best score: '+saved.exams[state.level+'-'+i]+'/12':'Not taken yet'}</p></div><span>›</span></div>`).join('')}</div>`}
function startExam(i){state.exam=i;state.q=0;state.answers=[];state.choice=null;state.done=false;go('test')}
function test(){const qs=questions(state.level,state.exam);if(state.q>=qs.length){const score=state.answers.filter((a,i)=>a===qs[i].answer).length;const key=state.level+'-'+state.exam;saved.exams[key]=Math.max(saved.exams[key]||0,score);save();return `${top('Your Results')}<div class="card"><div class="eyebrow" style="text-align:center;color:#658272">${state.level} · FORM ${state.exam+1}</div><div class="result">${score}<span style="font-size:25px;color:#7b9083">/12</span></div><p style="text-align:center">${score>=10?'Eccellente! Excellent work.':score>=7?'Ben fatto! Keep practicing.':'Keep going. Review your mistakes.'}</p><div class="progress"><div style="width:${pct(score,12)}%"></div></div><h3>Review your answers</h3>${qs.map((q,i)=>`<div class="word"><b>${i+1}. ${esc(q.prompt)}</b><span>${state.answers[i]===q.answer?'✓ Correct':'✕ Your answer: '+esc(state.answers[i]||'No answer')}</span><span>Correct: ${esc(q.answer)} · ${esc(q.why)}</span></div>`).join('')}<button class="btn full" onclick="go('exams')">Back to Exam Academy</button></div>`}const q=qs[state.q];return `${top(`${state.level} · Exam ${state.exam+1}`)}<div class="row between"><span class="muted small">Question ${state.q+1} of 12</span><span class="pill">${pct(state.q,12)}%</span></div><div class="progress"><div style="width:${pct(state.q,12)}%"></div></div><div class="card" style="margin-top:23px"><div class="eyebrow" style="color:#688679">CHOOSE THE BEST ANSWER</div><h2 style="font:normal 25px Georgia,serif;line-height:1.35;margin:22px 0">${esc(q.prompt)}</h2><div class="choices">${q.options.map((a,i)=>`<button class="choice ${state.choice===i?'selected':''}" onclick="state.choice=${i};render()">${esc(a)}</button>`).join('')}</div><button class="btn full" ${state.choice===null?'disabled':''} onclick="submitAnswer()">${state.q===11?'Finish exam':'Next question'} →</button></div><p class="notice">Answers are revealed after submission to make this a meaningful self-check.</p>`}
function submitAnswer(){const q=questions(state.level,state.exam)[state.q];state.answers.push(q.options[state.choice]);state.q++;state.choice=null;render();scrollTo(0,0)}
function profile(){const d=totalDone(),taken=Object.keys(saved.exams).length;return `${top('Your Profile')}<div class="card"><div class="row"><div class="num" style="width:55px;height:55px;border-radius:50%;font-size:25px">L</div><div><h2 style="font:normal 26px Georgia,serif;margin:0">Luke</h2><span class="muted small">New York → Italy</span></div></div><div class="row" style="margin-top:23px"><div class="stat"><b>${d}</b><small>LESSONS</small></div><div class="stat"><b>${taken}</b><small>EXAMS</small></div><div class="stat"><b>${pct(d,48)}%</b><small>COMPLETE</small></div></div></div><div class="section"><h2>Learning data</h2></div><div class="card"><h3>Back up your progress</h3><p class="notice">Your progress is saved in this browser on this iPhone. Clearing website data, switching devices or using Private Browsing can erase it. Export backups regularly.</p><div class="row"><button class="btn alt" onclick="backup()">Export backup ↓</button><button class="btn outline" onclick="$('#importFile').click()">Import backup ↑</button></div><input type="file" id="importFile" accept="application/json" style="display:none" onchange="restore(event)"></div><div class="card"><h3>Practice notes</h3><p class="notice">Write down Italian words or grammar you want to remember.</p><textarea id="notes" placeholder="My Italian notes...">${esc(saved.notes.text||'')}</textarea><button class="btn alt" style="margin-top:9px" onclick="saved.notes.text=$('#notes').value;save();alert('Notes saved on this device.')">Save notes</button></div><p class="footer-note">Italiano con Luke · Independent learning app · Not affiliated with an exam board.</p>`}
function backup(){const b=new Blob([JSON.stringify({version:3,saved,exported:new Date().toISOString()},null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='italiano-luke-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);if(!obj.saved||typeof obj.saved.completed!=='object'||typeof obj.saved.exams!=='object')throw Error('Invalid backup');if(confirm('Replace current progress with this backup?')){saved={completed:obj.saved.completed,exams:obj.saved.exams,reviews:obj.saved.reviews||[],notes:obj.saved.notes||{}};save();render();alert('Backup restored.')}}catch(err){alert('Could not import this file: '+err.message)}};r.readAsText(f)}
function render(){try{nav();$('#app').innerHTML=({home,learn,lesson,explore,story,exams,test,profile}[state.page]||home)()}catch(err){showFailure(err)}}
function showFailure(err){const el=document.getElementById('app');if(el){el.innerHTML='<div style="padding:28px 20px;font:16px -apple-system,Arial,sans-serif;color:#173c32"><h1>Italiano con Luke</h1><h2>Something went wrong</h2><p>The app could not load this section. Your saved progress has not been erased.</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f2ea;padding:12px;border-radius:12px">'+String(err&&err.message||err).replace(/</g,'&lt;')+'</pre><button style="padding:14px;border:0;border-radius:12px;background:#173c32;color:white" onclick="location.reload()">Try again</button></div>'}else{document.body.innerHTML='<h1>Italiano con Luke</h1><p>App startup error. Reload the page.</p>'}}
window.addEventListener('error',e=>showFailure(e.error||e.message));window.addEventListener('unhandledrejection',e=>showFailure(e.reason));render();
</script></body></html>
